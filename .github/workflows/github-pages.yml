name: Deploy to GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - dev
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache NHANES XPT files
        uses: actions/cache@v6
        with:
          path: ~/.cache/pandas_nhanes
          key: nhanes-xpt-v1

      - name: Install Python dependencies
        run: pip install pandas numpy requests

      - name: Build cycle data
        run: python build_cycle_data.py

      - name: Prepare site files
        run: |
          # Create a clean site directory with only the files needed for the website
          mkdir -p site
          cp index.html site/
          cp plots.json site/
          cp -r data site/
          cp -r Examples site/
          cp -r pandas_nhanes site/
          cp .nojekyll site/
        
      - name: Setup Pages
        uses: actions/configure-pages@v6
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
