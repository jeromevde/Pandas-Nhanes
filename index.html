<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pandas-nhanes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; margin: 2em; background-color: #f8f9fa; color: #212529; }
        h1, h2 { text-align: center; color: #343a40; }
        .container { max-width: 1200px; margin: 0 auto; }
        .grid-container {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
            margin-bottom: 3em;
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
        }
        
        .carousel-wrapper {
            display: flex;
            height: 100%;
            align-items: center;
            gap: 30px;
            overflow-y: hidden;
            /* Always visible for instant interaction */
        }
        
        .grid-item {
            background-color: #ffffff;
            border-radius: 12px;
            /* box-shadow removed for no shadow animation */
            position: relative;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            opacity: 0.0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .grid-item.active {
            opacity: 1;
            /* No box-shadow, no transform */
        }

        .grid-item.side {
            opacity: 0.5;
            /* No transform */
        }
        
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #333;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .carousel-nav:hover {
            background: rgba(255,255,255,1);
            transform: translateY(-50%) scale(1.1);
        }
        
        .carousel-nav.prev {
            left: 15px;
        }
        
        .carousel-nav.next {
            right: 15px;
        }
        
        .carousel-indicators {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .indicator.active {
            background: rgba(255,255,255,1);
            transform: scale(1.2);
        }

        /* Full-screen modal styles */
        .plot-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        .plot-modal.show {
            display: flex;
            opacity: 1;
            align-items: center;
            justify-content: center;
        }
        
        .plot-modal-content {
            background-color: #fff;
            border-radius: 12px;
            width: 95vw;
            height: 95vh;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.4, 0.2, 0.2, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .plot-modal.show .plot-modal-content {
            transform: scale(1);
        }
        
        .plot-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }
        
        .plot-modal-close:hover {
            background: rgba(255,255,255,1);
            transform: scale(1.1);
        }
        
        .plot-modal iframe {
            width: 90%;
            height: 90%;
            border: none;
            border-radius: 8px;
            transition: opacity 0.3s ease;
        }
        /* Centered modal iframe with max bounds to avoid taking all space */
        .plot-modal iframe.centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(95vw, 1200px);
            height: min(90vh, 850px);
        }
        .mini-iframe {
            border: none;
            background: #fff;
            border-radius: 8px;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            opacity: 1;
            transform-origin: center center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .mini-iframe.expanding {
            pointer-events: auto !important;
            border-radius: 16px !important;
            opacity: 1 !important;
            transform: scale(1) !important;
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
        .mini-iframe.fading {
            opacity: 0 !important;
            transition: opacity 0.3s ease-in-out;
        }
        .mini-iframe.expanded {
            position: fixed !important;
            left: 50% !important;
            top: 50% !important;
            width: 90vw !important;
            height: 90vh !important;
            z-index: 99999 !important;
            transform: translate(-50%, -50%) scale(1) !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            pointer-events: auto;
            margin: 0;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .mini-iframe-close {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 2vw;
            right: 2vw;
            background: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 2em;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .mini-iframe.expanded ~ .mini-iframe-close {
            display: flex;
        }
        .grid-item a {
            text-decoration: none;
            color: #007bff;
            font-weight: 500;
            font-size: 1.1em;
            margin-top: 0.5em;
            display: inline-block;
        }
        .grid-item a:hover {
            text-decoration: underline;
        }
        #variable-explorer {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 2em;
        }
        #variable-explorer .table-scroll {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
        }
        #search-input {
            width: 100%;
            padding: 0.8em;
            margin-bottom: 1.5em;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8em;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #f1f3f5;
        }
        tbody tr:hover {
            background-color: #f8f9fa;
        }
        /* Table status/loading */
        #table-status { font-size: 0.95em; color: #6c757d; margin: 0.5em 0 1em; }

        /* Responsive tweaks */
        @media (max-width: 768px) {
            body { margin: 1em; }
            .grid-container { height: 260px; padding: 12px; }
            .carousel-wrapper { gap: 16px; }
            .plot-modal-content { width: 100vw; height: 100vh; border-radius: 0; }
            .plot-modal iframe.centered { width: min(100vw, 100%); height: min(100vh, 100%); }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }
        .modal.show {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 85%;
            height: 85%;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .modal.show .modal-content {
            transform: scale(1);
        }
        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-button {
            color: #555;
            align-self: flex-end;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close-button:hover,
        .close-button:focus {
            color: #000;
        }
        .expanding-iframe-overlay {
            position: fixed;
            z-index: 2000;
            background: #fff;
            box-shadow: 0 16px 32px rgba(0,0,0,0.18);
            border-radius: 8px;
            transition: all 0.5s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.3s;
            opacity: 1;
            pointer-events: auto;
        }
        .expanding-iframe-overlay.fullscreen {
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            opacity: 1;
            transform: scale(1) !important;
        }
        .modal-bg {
            display: none;
            position: fixed;
            z-index: 4000;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .modal-bg.show {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .mini-iframe.expanded {
            z-index: 5000 !important;
        }
        .container.modal-active {
            pointer-events: none;
            filter: blur(2px) grayscale(0.2);
        }
        .container.modal-active .mini-iframe.expanded {
            pointer-events: auto;
            filter: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>pandas-nhanes</h1>
        
        <div class="grid-container" id="grid-container">
            
            <div class="carousel-wrapper" id="carousel-wrapper">
                <!-- Plot thumbnails will be automatically generated here -->
            </div>
            
            <div class="carousel-indicators" id="carousel-indicators">
                <!-- Indicators will be generated automatically -->
            </div>
        </div>

        <div id="variable-explorer">
            <h2>NHANES Variable Explorer</h2>
            <input type="text" id="search-input" placeholder="Search variables...">
            <div class="table-scroll">
                <table id="variables-table">
                    <thead>
                        <tr id="variables-table-header-row">
                            <!-- Headers will be loaded here -->
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Full-screen plot modal -->
    <div id="plot-modal" class="plot-modal">
        <div class="plot-modal-content">
            <button class="plot-modal-close" id="modal-close-btn">&times;</button>
            <iframe id="modal-iframe" src=""></iframe>
        </div>
    </div>

    <script>
        // PNG/HTML pairs for carousel and modal - hardcoded
        const plotExamples = [
            { base: 'BMD_Age_Gender', png: 'Examples/BMD_Age_Gender/BMD_Age_Gender.png', html: 'Examples/BMD_Age_Gender/BMD_Age_Gender.html' },
            { base: 'Cholesterol_Age', png: 'Examples/Cholesterol_Age/Cholesterol_Age.png', html: 'Examples/Cholesterol_Age/Cholesterol_Age.html' },
            { base: 'Correlation_Matrix_2009_2010', png: 'Examples/Correlation_Matrix_2009_2010/Correlation_Matrix_2009_2010.png', html: 'Examples/Correlation_Matrix_2009_2010/Correlation_Matrix_2009_2010.html' },
            { base: 'Correlation_Matrix_2011_2012', png: 'Examples/Correlation_Matrix_2011_2012/Correlation_Matrix_2011_2012.png', html: 'Examples/Correlation_Matrix_2011_2012/Correlation_Matrix_2011_2012.html' },
            { base: 'Correlation_Matrix_2013_2014', png: 'Examples/Correlation_Matrix_2013_2014/Correlation_Matrix_2013_2014.png', html: 'Examples/Correlation_Matrix_2013_2014/Correlation_Matrix_2013_2014.html' },
            { base: 'Correlation_Matrix_2015_2016', png: 'Examples/Correlation_Matrix_2015_2016/Correlation_Matrix_2015_2016.png', html: 'Examples/Correlation_Matrix_2015_2016/Correlation_Matrix_2015_2016.html' },
            { base: 'Correlation_Matrix_2017_2018', png: 'Examples/Correlation_Matrix_2017_2018/Correlation_Matrix_2017_2018.png', html: 'Examples/Correlation_Matrix_2017_2018/Correlation_Matrix_2017_2018.html' },
            { base: 'Estradiol_Age_Gender', png: 'Examples/Estradiol_Age_Gender/Estradiol_Age_Gender.png', html: 'Examples/Estradiol_Age_Gender/Estradiol_Age_Gender.html' },
            { base: 'Sleep_Depression', png: 'Examples/Sleep_Depression/Sleep_Depression.png', html: 'Examples/Sleep_Depression/Sleep_Depression.html' },
            { base: 'Testosterone_Age_Gender', png: 'Examples/Testosterone_Age_Gender/Testosterone_Age_Gender.png', html: 'Examples/Testosterone_Age_Gender/Testosterone_Age_Gender.html' },
            { base: 'Testosterone_Estrogen_Ratio', png: 'Examples/Testosterone_Estrogen_Ratio/Testosterone_Estrogen_Ratio.png', html: 'Examples/Testosterone_Estrogen_Ratio/Testosterone_Estrogen_Ratio.html' }
        ];
        let currentIndex = 0;
        let plotItems = [];
        
        // No longer loading from plots.txt

// Add images to carousel as they load, show carousel after first image
function loadImagesIndividually(plotExamples, baseWidth = 300) {
    const carouselWrapper = document.getElementById('carousel-wrapper');
    const indicatorsContainer = document.getElementById('carousel-indicators');
    plotItems = [];
    plotExamples.forEach((plot, index) => {
        const img = new window.Image();
        img.src = plot.png;
        img.alt = plot.base;
        img.onload = function() {
            const aspectRatio = img.naturalWidth / img.naturalHeight;
            const thumbnailWidth = baseWidth;
            const thumbnailHeight = Math.round(baseWidth / aspectRatio);
            const gridItem = document.createElement('div');
            gridItem.className = 'grid-item';
            gridItem.dataset.index = index;
            gridItem.style.width = `${thumbnailWidth}px`;
            gridItem.style.height = `${thumbnailHeight}px`;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '100%';
            img.style.objectFit = 'contain';
            img.style.display = 'block';
            img.style.margin = '0 auto';
            gridItem.appendChild(img);
            gridItem.addEventListener('click', function(e) {
                if (!e.target.closest('.indicator') && !e.target.closest('.carousel-nav')) {
                    e.preventDefault();
                    openModalFromTile(gridItem);
                }
            });
            // Insert in correct order
            if (carouselWrapper.children.length > index) {
                carouselWrapper.insertBefore(gridItem, carouselWrapper.children[index]);
            } else {
                carouselWrapper.appendChild(gridItem);
            }
            // Add indicator if not already present
            if (!indicatorsContainer.querySelector(`[data-index="${index}"]`)) {
                const indicator = document.createElement('div');
                indicator.className = 'indicator';
                indicator.dataset.index = index;
                indicator.addEventListener('click', () => goToSlide(index));
                indicatorsContainer.appendChild(indicator);
            }
            plotItems[index] = { element: gridItem, base: plot.base, width: img.naturalWidth, height: img.naturalHeight };
            // Enable horizontal scrolling with snap
            carouselWrapper.style.overflowX = 'auto';
            carouselWrapper.style.scrollSnapType = 'x mandatory';
            carouselWrapper.style.scrollBehavior = 'smooth';
            carouselWrapper.childNodes.forEach(node => {
                if (node.nodeType === 1) node.style.scrollSnapAlign = 'center';
            });
            // Fade in the grid item
            setTimeout(() => {
                gridItem.style.opacity = '0.7';
                if (index === currentIndex) gridItem.classList.add('active');
            }, 10);
            updateCarousel();
        };
        img.onerror = function() {
            // fallback: still add a blank grid item
            const gridItem = document.createElement('div');
            gridItem.className = 'grid-item';
            gridItem.dataset.index = index;
            gridItem.style.width = `${baseWidth}px`;
            gridItem.style.height = `${baseWidth}px`;
            gridItem.textContent = 'Image failed';
            if (carouselWrapper.children.length > index) {
                carouselWrapper.insertBefore(gridItem, carouselWrapper.children[index]);
            } else {
                carouselWrapper.appendChild(gridItem);
            }
            plotItems[index] = { element: gridItem, base: plot.base };
            setTimeout(() => {
                gridItem.style.opacity = '0.7';
                if (index === currentIndex) gridItem.classList.add('active');
            }, 10);
            updateCarousel();
        };
    });
}

        function createPlotThumbnails() {
    const carouselWrapper = document.getElementById('carousel-wrapper');
    const indicatorsContainer = document.getElementById('carousel-indicators');
            // Responsive thumbnail width
            const baseWidth = Math.min(300, Math.max(160, Math.floor(window.innerWidth * 0.7)));
    // Remove any existing children (for reloads)
    carouselWrapper.innerHTML = '';
    indicatorsContainer.innerHTML = '';
    loadImagesIndividually(plotExamples, baseWidth);
}

        function updateCarousel() {
            const wrapper = document.getElementById('carousel-wrapper');
            plotItems.forEach((item, index) => {
                if (!item || !item.element) return;
                const element = item.element;
                element.classList.remove('active', 'side');
                if (index === currentIndex) {
                    element.classList.add('active');
                } else if (Math.abs(index - currentIndex) === 1) {
                    element.classList.add('side');
                }
            });
            document.querySelectorAll('.indicator').forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentIndex);
            });
            // Scroll to the active item if not user scrolling
            if (!wrapper.classList.contains('user-scrolling')) {
                const activeItem = plotItems[currentIndex] && plotItems[currentIndex].element;
                if (activeItem) {
                    activeItem.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }
        }

        function goToSlide(index) {
            if (index >= 0 && index < plotItems.length) {
                currentIndex = index;
                updateCarousel();
            }
        }
        function nextSlide() {
            if (currentIndex < plotItems.length - 1) {
                goToSlide(currentIndex + 1);
            }
        }
        function prevSlide() {
            if (currentIndex > 0) {
                goToSlide(currentIndex - 1);
            }
        }

        // --- Modal logic: show HTML in iframe for expanded view ---
        function openModalFromTile(gridItem) {
            const index = parseInt(gridItem.dataset.index);
            const plot = plotExamples[index];
            if (!plot) return;
            const modal = document.getElementById('plot-modal');
            const modalContent = document.querySelector('.plot-modal-content');
            let modalImg = document.getElementById('modal-img');
            let modalIframe = document.getElementById('modal-iframe');
            // Remove any previous modalImg
            if (modalImg) modalImg.remove();
            // Hide iframe and reset src
            if (modalIframe) {
                modalIframe.style.opacity = '0';
                modalIframe.style.display = 'none';
                modalIframe.src = '';
            }
            // Add PNG image as background
            modalImg = document.createElement('img');
            modalImg.id = 'modal-img';
            modalImg.src = plot.png;
            modalImg.alt = plot.base;
            modalImg.style.position = 'absolute';
            modalImg.style.top = '0';
            modalImg.style.left = '0';
            modalImg.style.width = '100%';
            modalImg.style.height = '100%';
            modalImg.style.objectFit = 'contain';
            modalImg.style.zIndex = '1';
            modalImg.style.transition = 'opacity 0.3s';
            modalImg.style.opacity = '1';
            // Insert image as first child of modalContent
            modalContent.insertBefore(modalImg, modalContent.firstChild);
            // Show modal
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
            // Now load the HTML in the iframe, fade in when loaded
            if (modalIframe && plot.html) {
                modalIframe.src = plot.html;
                modalIframe.style.display = 'block';
                modalIframe.classList.add('centered');
                modalIframe.style.zIndex = '2';
                modalIframe.style.background = 'transparent';
                modalIframe.style.opacity = '0';
                modalIframe.style.transition = 'opacity 0.5s';
                // Size to the image dimensions and scale to fit container
                const dims = plotItems[index] || {};
                if (dims.width && dims.height) {
                    modalIframe.dataset.contentWidth = String(dims.width);
                    modalIframe.dataset.contentHeight = String(dims.height);
                } else {
                    // Fallback defaults
                    modalIframe.dataset.contentWidth = '1200';
                    modalIframe.dataset.contentHeight = '800';
                }
                fitModalIframe();
                // Fade in iframe when loaded, hide PNG
                modalIframe.onload = function() {
                    setTimeout(() => {
                        fitModalIframe();
                        modalIframe.style.opacity = '1';
                        if (modalImg) {
                            modalImg.style.transition = 'opacity 0.5s';
                            modalImg.style.opacity = '0';
                            setTimeout(() => {
                                if (modalImg && modalImg.parentNode) modalImg.parentNode.removeChild(modalImg);
                            }, 500);
                        }
                    }, 50);
                };
            }
        }

        // Compute a scale so the iframe (using PNG dims) fits within modal content, center it
        function fitModalIframe() {
            const modal = document.getElementById('plot-modal');
            if (!modal || !modal.classList.contains('show')) return;
            const modalIframe = document.getElementById('modal-iframe');
            const modalContent = document.querySelector('.plot-modal-content');
            if (!modalIframe || !modalContent) return;
            const contentW = parseFloat(modalIframe.dataset.contentWidth || '1200');
            const contentH = parseFloat(modalIframe.dataset.contentHeight || '800');
            const rect = modalContent.getBoundingClientRect();
            const maxW = rect.width * 0.98;
            const maxH = rect.height * 0.98;
            const scale = Math.min(maxW / contentW, maxH / contentH, 1);
            modalIframe.style.position = 'absolute';
            modalIframe.style.top = '50%';
            modalIframe.style.left = '50%';
            modalIframe.style.width = contentW + 'px';
            modalIframe.style.height = contentH + 'px';
            modalIframe.style.transformOrigin = 'center center';
            modalIframe.style.transform = `translate(-50%, -50%) scale(${scale})`;
            modalIframe.style.willChange = 'transform';
        }
        function closeModal() {
            const modal = document.getElementById('plot-modal');
            const modalImg = document.getElementById('modal-img');
            const modalIframe = document.getElementById('modal-iframe');
            modal.classList.remove('show');
            setTimeout(() => {
                if (modalImg) modalImg.remove();
                if (modalIframe) modalIframe.src = '';
                if (modalIframe) modalIframe.style.display = '';
            }, 300);
            document.body.style.overflow = '';
        }

        document.addEventListener("DOMContentLoaded", async function() {
            // Use hardcoded plotExamples array directly
            createPlotThumbnails();
            // Removed prev/next button event listeners since buttons are gone
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    prevSlide();
                } else if (e.key === 'ArrowRight') {
                    nextSlide();
                } else if (e.key === 'Escape') {
                    closeModal();
                }
            });
            // Touch/double-touch swipe
            let startX = 0;
            let startY = 0;
            let touchCount = 0;
            const carousel = document.getElementById('grid-container');
            carousel.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    touchCount = 2;
                    startX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    startY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                } else if (e.touches.length === 1) {
                    touchCount = 1;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }
            }, { passive: true });
            carousel.addEventListener('touchend', (e) => {
                let endX, endY;
                if (touchCount === 2 && e.changedTouches.length >= 2) {
                    endX = (e.changedTouches[0].clientX + e.changedTouches[1].clientX) / 2;
                    endY = (e.changedTouches[0].clientY + e.changedTouches[1].clientY) / 2;
                } else {
                    endX = e.changedTouches[0].clientX;
                    endY = e.changedTouches[0].clientY;
                }
                const diffX = startX - endX;
                const diffY = startY - endY;
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        nextSlide();
                    } else {
                        prevSlide();
                    }
                }
                touchCount = 0;
            }, { passive: true });
            // Enable mouse/touchpad horizontal scroll for carousel
            const carouselWrapper = document.getElementById('carousel-wrapper');
            let scrollTimeout;
            carouselWrapper.addEventListener('scroll', function() {
                carouselWrapper.classList.add('user-scrolling');
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    // Find the closest grid-item to the center
                    const wrapperRect = carouselWrapper.getBoundingClientRect();
                    let minDist = Infinity;
                    let closestIdx = 0;
                    plotItems.forEach((item, idx) => {
                        const rect = item.element.getBoundingClientRect();
                        const itemCenter = rect.left + rect.width / 2;
                        const dist = Math.abs(itemCenter - (wrapperRect.left + wrapperRect.width / 2));
                        if (dist < minDist) {
                            minDist = dist;
                            closestIdx = idx;
                        }
                    });
                    if (closestIdx !== currentIndex) {
                        currentIndex = closestIdx;
                        updateCarousel();
                    }
                    carouselWrapper.classList.remove('user-scrolling');
                }, 120);
            }, { passive: true });
            window.addEventListener('resize', () => {
                updateCarousel();
                fitModalIframe();
            });
            const searchInput = document.getElementById('search-input');
            const tableBody = document.querySelector('#variables-table tbody');
            const tableHeaderRow = document.getElementById('variables-table-header-row');
            let allData = []; // raw objects
            let fields = [];
            let allRowEls = []; // tr elements for current render
            // Status element
            const statusEl = document.createElement('div');
            statusEl.id = 'table-status';
            statusEl.textContent = 'Loading variables...';
            const explorer = document.getElementById('variable-explorer');
            explorer.insertBefore(statusEl, explorer.querySelector('.table-scroll'));

            // Helper: render header once
            function renderHeader(cols) {
                if (!cols || !cols.length) return;
                tableHeaderRow.innerHTML = '';
                cols.forEach(field => {
                    const th = document.createElement('th');
                    th.textContent = field;
                    tableHeaderRow.appendChild(th);
                });
            }
            // Helper: build a row element from data
            function buildRow(row) {
                const tr = document.createElement('tr');
                tr.innerHTML = fields.map(f => {
                    const v = row[f];
                    if (f === 'dataset link' && v) {
                        return `<td><a href="${v}" target="_blank" rel="noopener">data</a></td>`;
                    } else if (f === 'dataset documentation link' && v) {
                        return `<td><a href="${v}" target="_blank" rel="noopener">doc</a></td>`;
                    } else {
                        return `<td>${v || ''}</td>`;
                    }
                }).join('');
                return tr;
            }
            // Incremental append in batches to avoid layout thrash
            function appendBatch(batch) {
                const frag = document.createDocumentFragment();
                batch.forEach(row => {
                    const tr = buildRow(row);
                    frag.appendChild(tr);
                    allRowEls.push(tr);
                });
                tableBody.appendChild(frag);
            }
            // Append queue processed on idle frames
            const appendQueue = [];
            const buffer = [];
            let appendScheduled = false;
            function scheduleAppend() {
                if (appendScheduled) return;
                appendScheduled = true;
                (window.requestIdleCallback || window.requestAnimationFrame)(function() {
                    appendScheduled = false;
                    const batch = appendQueue.shift();
                    if (batch) {
                        appendBatch(batch);
                        if (appendQueue.length) scheduleAppend();
                    }
                });
            }
            // Stream parse using worker
            const csvUrl = new URL('./pandas_nhanes/nhanes_variables.csv', window.location.href).toString();
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                worker: true,
                step: function(results, parser) {
                    const row = results.data;
                    if (fields.length === 0 && results.meta && results.meta.fields) {
                        fields = results.meta.fields.slice();
                        renderHeader(fields);
                    }
                    // Only keep non-empty rows
                    if (fields.some(f => row[f] && String(row[f]).trim() !== '')) {
                        allData.push(row);
                        // Buffer rows then append in chunks
                        buffer.push(row);
                        if (buffer.length >= 100) {
                            const batch = buffer.splice(0, buffer.length);
                            appendQueue.push(batch);
                            scheduleAppend();
                        }
                    }
                },
                complete: function() {
                    if (buffer.length) {
                        appendQueue.push(buffer.splice(0, buffer.length));
                        scheduleAppend();
                    }
                    statusEl.textContent = `Loaded ${allData.length.toLocaleString()} variables.`;
                },
                error: function(err) {
                    statusEl.textContent = `Failed to load variables: ${err}`;
                }
            });

            // Debounced, async search over allData with chunked DOM updates
            let searchEpoch = 0;
            function applySearch(term) {
                const myEpoch = ++searchEpoch;
                // Reset table quickly
                tableBody.innerHTML = '';
                allRowEls = [];
                if (!term) {
                    // Render first N quickly, then stream rest for idle loading
                    const initial = allData.slice(0, 300);
                    appendBatch(initial);
                    let idx = 300;
                    function streamRest() {
                        if (myEpoch !== searchEpoch) return; // canceled
                        if (idx >= allData.length) return;
                        const next = allData.slice(idx, idx + 300);
                        idx += 300;
                        appendBatch(next);
                        (window.requestIdleCallback || window.requestAnimationFrame)(streamRest);
                    }
                    (window.requestIdleCallback || window.requestAnimationFrame)(streamRest);
                    statusEl.textContent = `Showing ${Math.min(300, allData.length).toLocaleString()} of ${allData.length.toLocaleString()} rows (idle streaming...)`;
                    return;
                }
                const lower = term.toLowerCase();
                let i = 0;
                let shown = 0;
                function processChunk() {
                    if (myEpoch !== searchEpoch) return; // canceled
                    const end = Math.min(i + 400, allData.length);
                    const batch = [];
                    for (; i < end; i++) {
                        const row = allData[i];
                        // Fast stringify and match
                        for (let k = 0; k < fields.length; k++) {
                            const v = row[fields[k]];
                            if (v && String(v).toLowerCase().includes(lower)) {
                                batch.push(row);
                                break;
                            }
                        }
                    }
                    if (batch.length) {
                        appendBatch(batch);
                        shown += batch.length;
                        statusEl.textContent = `Found ${shown.toLocaleString()} (scanning...)`;
                    }
                    if (i < allData.length) {
                        setTimeout(processChunk, 0);
                    } else {
                        statusEl.textContent = `Found ${shown.toLocaleString()} matches.`;
                    }
                }
                processChunk();
            }
            function debounce(fn, delay) {
                let t;
                return (...args) => {
                    clearTimeout(t);
                    t = setTimeout(() => fn.apply(null, args), delay);
                };
            }
            const onSearch = debounce(() => applySearch(searchInput.value.trim()), 150);
            searchInput.addEventListener('input', onSearch);
            document.getElementById('modal-close-btn').addEventListener('click', closeModal);
            document.getElementById('plot-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
            document.addEventListener('mousedown', function(e) {
                const modal = document.getElementById('plot-modal');
                if (modal.classList.contains('show') && e.target === modal) {
                    closeModal();
                }
            });
            // (Removed document-level click handler for grid-item)
        });
    </script>
</body>
</html>
