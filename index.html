        async function drawDistribution(cycle, varName, stratifyBy) {
            const panel = document.getElementById('dist-plot');
            // Purge any existing Plotly instance before clearing innerHTML,
            // otherwise Plotly's internal state conflicts with the new render.
            Plotly.purge('dist-plot');
            panel.innerHTML = '<div class="corr-loading-msg">Loading…</div>';

            const rawScatter = await loadScatterData(cycle);
            // Wait for the browser to paint the panel visible before Plotly measures it
            await new Promise(r => requestAnimationFrame(r));
            if (!rawScatter || !rawScatter.data[varName]) {
                panel.innerHTML = `<p class="corr-no-data"><b>${varName}</b> not available in ${cycle} data.</p>`;
                return;
            }
            const scatterData = applyPopFilter(rawScatter) || rawScatter;

            const raw      = scatterData.data[varName];
            const colTypes = scatterData.col_types || {};
            const isNum    = (colTypes[varName] || 'num') === 'num';
            const valid    = raw.filter(v => v !== null);

            if (!valid.length) {
                panel.innerHTML = '<p class="corr-no-data">No data available.</p>';
                return;
            }

            const cfg        = { responsive: true, displayModeBar: false };
            const baseLayout = {
                margin: { t: 40, r: 20, b: 60, l: 60 },
                paper_bgcolor: '#fafbfc', plot_bgcolor: '#fafbfc',
                font: { family: 'system-ui, -apple-system, sans-serif', size: 11 },
                legend: { orientation: 'v', x: 1.02, xanchor: 'left', y: 1 },
                xaxis: { title: varName, automargin: true },
            };

            // value_labels from nhanes_value_labels.json (loaded once at startup)
            // Fall back to hardcoded STRAT_LABELS for population vars
            // (getLabels and applyLabel are defined at module scope)

            if (!stratifyBy) {
                // ── Unstratified ──────────────────────────────────────────────
                if (isNum) {
                    const rangeX = robustRange(valid);
                    const kdeVals = rangeX ? valid.filter(v => v >= rangeX.lower && v <= rangeX.upper) : valid;
                    const h    = Math.max(1e-10, 1.06 * distStdDev(kdeVals) * Math.pow(kdeVals.length, -0.2));
                    const xMin = rangeX ? rangeX.lower : Math.min(...valid);
                    const xMax = rangeX ? rangeX.upper : Math.max(...valid);
                    const pts  = Array.from({length: 300}, (_, i) => xMin + (i / 299) * (xMax - xMin));
                    const kde  = gaussianKDE(kdeVals, h, pts);
                    Plotly.react('dist-plot', [
                        { x: valid, type: 'histogram', histnorm: 'probability density',
                          name: varName, marker: { color: DIST_PALETTE[0], opacity: 0.45, line: { width: 0 } },
                          showlegend: false },
                        { x: pts, y: kde, type: 'scatter', mode: 'lines', name: 'KDE',
                          line: { color: '#1a365d', width: 2.5 }, showlegend: false, hoverinfo: 'skip' }
                    ], { ...baseLayout,
                        title: { text: `Distribution of ${varName}  (n=${valid.length.toLocaleString()})${clippedAxisNote(rangeX)}${cleanedCodeNote(scatterData, varName)}`, font: { size: 13 } },
                        xaxis: { title: varName, automargin: true, ...(rangeX ? { range: rangeX.range } : {}) },
                        yaxis: { title: 'Density', automargin: true } }, cfg);
                } else {
                    const counts   = {};
                    for (const v of valid) counts[v] = (counts[v] || 0) + 1;
                    const cats     = Object.keys(counts).map(Number).sort((a, b) => a - b);
                    const labelMap = getLabels(varName);
                    Plotly.react('dist-plot',
                        [{ x: cats.map(c => applyLabel(labelMap, c)),
                           y: cats.map(c => counts[c]),
                           type: 'bar', marker: { color: DIST_PALETTE[0], opacity: 0.75 } }],
                        { ...baseLayout,
                          title: { text: `Distribution of ${varName}  (n=${valid.length.toLocaleString()})`, font: { size: 13 } },
                          yaxis: { title: 'Count', automargin: true } }, cfg);
                }
            } else {
                // ── Stratified ────────────────────────────────────────────────
                const srcCol      = STRAT_SOURCE[stratifyBy] || stratifyBy;
                const stratRaw    = scatterData.data[srcCol];
                if (!stratRaw) {
                    panel.innerHTML = `<p class="corr-no-data">Stratification variable <b>${srcCol}</b> not available in ${cycle}.</p>`;
                    return;
                }
                const binFn       = STRAT_BINS[stratifyBy] || (v => v === null ? null : String(v));
                const stratLabels = getLabels(srcCol);

                const groups = {};
                for (let i = 0; i < raw.length; i++) {
                    const yv = raw[i], sv = stratRaw[i];
                    if (yv === null || sv === null) continue;
                    const key = binFn(sv);
                    if (key === null) continue;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(yv);
                }

                let orderedKeys = STRAT_ORDER[stratifyBy]
                    ? STRAT_ORDER[stratifyBy].filter(k => groups[k])
                    : Object.keys(groups).sort((a, b) => Number(a) - Number(b));

                if (!orderedKeys.length) {
                    panel.innerHTML = '<p class="corr-no-data">No overlapping data for the selected stratification.</p>';
                    return;
                }

                if (isNum) {
                    const allVals = orderedKeys.flatMap(k => groups[k]);
                    const rangeX = robustRange(allVals);
                    const xMin   = rangeX ? rangeX.lower : Math.min(...allVals);
                    const xMax   = rangeX ? rangeX.upper : Math.max(...allVals);
                    const pts    = Array.from({length: 300}, (_, i) => xMin + (i / 299) * (xMax - xMin));
                    const traces = orderedKeys.map((key, idx) => {
                        const vals  = rangeX ? groups[key].filter(v => v >= rangeX.lower && v <= rangeX.upper) : groups[key];
                        if (!vals.length) return null;
                        const h     = Math.max(1e-10, 1.06 * distStdDev(vals) * Math.pow(vals.length, -0.2));
                        const kde   = gaussianKDE(vals, h, pts);
                        const label = applyLabel(stratLabels, key);
                        return { x: pts, y: kde, type: 'scatter', mode: 'lines',
                                 name: `${label} (n=${vals.length.toLocaleString()})`,
                                 line: { color: DIST_PALETTE[idx % DIST_PALETTE.length], width: 2.2 },
                                 fill: 'tozeroy', fillcolor: DIST_PALETTE_FILL[idx % DIST_PALETTE_FILL.length],
                                 hovertemplate: `%{x:.3g}<extra>${label}</extra>` };
                    }).filter(Boolean);
                    if (!traces.length) {
                        panel.innerHTML = '<p class="corr-no-data">No values inside the display range for the selected stratification.</p>';
                        return;
                    }
                    Plotly.react('dist-plot', traces, {
                        ...baseLayout,
                        title: { text: `${varName} by ${stratifyBy.replace('_bin', '')}${clippedAxisNote(rangeX)}${cleanedCodeNote(scatterData, varName)}`, font: { size: 13 } },
                        xaxis: { title: varName, automargin: true, ...(rangeX ? { range: rangeX.range } : {}) },
                        yaxis: { title: 'Density', automargin: true }
                    }, cfg);
                } else {
                    const mainLabels = getLabels(varName);
                    const cats  = [...new Set(valid)].map(Number).sort((a, b) => a - b);
                    const traces = orderedKeys.map((key, idx) => {
                        const vals   = groups[key];
                        const counts = {};
                        for (const v of vals) counts[v] = (counts[v] || 0) + 1;
                        const label  = applyLabel(stratLabels, key);
                        return { x: cats.map(c => applyLabel(mainLabels, c)),
                                 y: cats.map(c => counts[c] || 0),
                                 type: 'bar', name: `${label} (n=${vals.length.toLocaleString()})`,
                                 marker: { color: DIST_PALETTE[idx % DIST_PALETTE.length], opacity: 0.8 } };
                    });
                    Plotly.react('dist-plot', traces, {
                        ...baseLayout,
                        title: { text: `${varName} by ${stratifyBy.replace('_bin', '')}`, font: { size: 13 } },
                        barmode: 'group', yaxis: { title: 'Count', automargin: true }
                    }, cfg);
                }
            }
        }

                    nextSlide();
                } else if (e.key === 'Escape') {
                    closeModal();
                    closeCorrelates();
                }
            });
            // Touch/double-touch swipe
            let startX = 0;
            let startY = 0;
            let touchCount = 0;
            const carousel = document.getElementById('grid-container');
            carousel.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    touchCount = 2;
                    startX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    startY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                } else if (e.touches.length === 1) {
                    touchCount = 1;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }
            }, { passive: true });
            carousel.addEventListener('touchend', (e) => {
                let endX, endY;
                if (touchCount === 2 && e.changedTouches.length >= 2) {
                    endX = (e.changedTouches[0].clientX + e.changedTouches[1].clientX) / 2;
                    endY = (e.changedTouches[0].clientY + e.changedTouches[1].clientY) / 2;
                } else {
                    endX = e.changedTouches[0].clientX;
                    endY = e.changedTouches[0].clientY;
                }
                const diffX = startX - endX;
                const diffY = startY - endY;
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        nextSlide();
                    } else {
                        prevSlide();

                touchCount = 0;
            }, { passive: true });
            // Enable mouse/touchpad horizontal scroll for carousel
            const carouselWrapper = document.getElementById('carousel-wrapper');
            let scrollTimeout;
            carouselWrapper.addEventListener('scroll', function() {
                carouselWrapper.classList.add('user-scrolling');
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    // Find the closest grid-item to the center

            // Row click opens correlates modal; doc links stop propagation
            tableBody.addEventListener('click', e => {

                const tr = e.target.closest('tr');

            // Status element
            const statusEl = document.createElement('div');
            statusEl.id = 'table-status';
            statusEl.textContent = 'Loading variables...';
            const explorer = document.getElementById('variable-explorer');
            explorer.insertBefore(statusEl, explorer.querySelector('.table-scroll'));

            // Fixed header for measurement-grouped table
            function renderHeader() {
                tableHeaderRow.innerHTML = '';
                for (const text of ['Measurement', 'Description', 'Variable name(s) & cycles', 'Doc']) {
                    const th = document.createElement('th');
                    th.textContent = text;
                    tableHeaderRow.appendChild(th);
                }
            }

            // Group rows: Step 1 by varName, Step 2 merge by normalized explanation
            function normalizeExpl(s) { return (s || '').trim().replace(/\s+/g, ' ').toLowerCase(); }
            function escAttr(s) {
                return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function buildMeasurementData(rawData) {
                const byVar = new Map();
                rawData.forEach(row => {
                    const vn = (row['variable name'] || '').trim();
                    if (!vn) return;
                    if (!byVar.has(vn)) byVar.set(vn, { varName: vn, explanation: row['variable explanation'] || '', cycles: [], docLink: '' });
                    const e = byVar.get(vn);
                    const cycle = (row['cycle name'] || '').trim();
                    if (cycle && !e.cycles.includes(cycle)) e.cycles.push(cycle);
                    if (row['dataset documentation link']) e.docLink = row['dataset documentation link'];
                });
                byVar.forEach(e => e.cycles.sort());

                const byExpl = new Map();
                for (const entry of byVar.values()) {
                    const key = normalizeExpl(entry.explanation);
                    if (!byExpl.has(key)) byExpl.set(key, { explanation: entry.explanation, varEntries: [] });
                    byExpl.get(key).varEntries.push(entry);
                }

                const result = [];
                for (const group of byExpl.values()) {
                    group.varEntries.sort((a, b) => {
                        if (b.cycles.length !== a.cycles.length) return b.cycles.length - a.cycles.length;
                        return (b.cycles[b.cycles.length-1]||'').localeCompare(a.cycles[a.cycles.length-1]||'');
                    });
                    const best = group.varEntries[0];
                    result.push({
                        explanation: group.explanation,
                        varEntries:  group.varEntries,
                        bestVarName: best.varName,
                        bestCycle:   best.cycles[best.cycles.length - 1] || '',
                        bestDocLink: group.varEntries.find(e => e.docLink)?.docLink || '',
                    });
                }
                result.sort((a, b) => a.explanation.localeCompare(b.explanation));
                return result;
            }

            // Build a single measurement table row
            function buildMeasurementRow(entry) {
                const tr = document.createElement('tr');
                tr.dataset.var   = entry.bestVarName;
                tr.dataset.desc  = entry.explanation;
                tr.dataset.doc   = entry.bestDocLink;
                tr.dataset.cycle = entry.bestCycle;

                const det    = varDetails[entry.bestVarName] || {};
                const tgt    = (det.target       || '').trim();
                const et     = (det.english_text || '').trim();
                const descText = (et && et.toLowerCase() !== entry.explanation.toLowerCase()) ? et : '';

                const varCellHtml = entry.varEntries.map(ve => {
                    const chips = ve.cycles.map(c => `<span class="cycle-chip">${c}</span>`).join('');
                    const latestCycle = ve.cycles[ve.cycles.length - 1] || '';
                    return `<div class="var-cycles-row" data-var-option="${escAttr(ve.varName)}" data-var-cycle="${escAttr(latestCycle)}" data-var-doc="${escAttr(ve.docLink)}"><span class="var-entry-name">${ve.varName}</span>${chips}</div>`;
                }).join('');

                const docHtml = entry.bestDocLink
                    ? `<a href="${entry.bestDocLink.replace(/"/g,'&quot;')}" target="_blank" rel="noopener">doc ↗</a>` : '';

                tr.innerHTML =
                    `<td style="font-size:0.88em;padding:0.8em 0.5em;font-weight:600"` +
                    (tgt ? ` title="${tgt.replace(/"/g,'&quot;')}"` : '') + `>` +
                    entry.explanation +
                    `</td>` +
                    `<td style="font-size:0.82em;color:#718096;padding:0.8em 0.5em">${descText}</td>` +
                    `<td class="cycles-cell">${varCellHtml}</td>` +
                    `<td style="white-space:nowrap">${docHtml}</td>`;
                return tr;
            }

            function appendGroupedBatch(entries) {
                const frag = document.createDocumentFragment();
                entries.forEach(entry => { const tr = buildMeasurementRow(entry); frag.appendChild(tr); allRowEls.push(tr); });
                tableBody.appendChild(frag);
            }

            // Stream parse – collect only, no incremental table render
            const csvUrl = new URL('./pandas_nhanes/nhanes_variables.csv', window.location.href).toString();
            Papa.parse(csvUrl, {
                download: true, header: true, worker: true,
                step: function(results) {
                    const row = results.data;
                    if (row['variable name'] && String(row['variable name']).trim()) allData.push(row);
                },
                complete: function() {
                    // Build varMeta for the correlates drawer
                    allData.forEach(row => {
                        const vn = row['variable name'];
                        if (vn && !varMeta[vn]) {
                            varMeta[vn] = { desc: row['variable explanation'] || '', docLink: row['dataset documentation link'] || '' };
                        }
                    });
                    measurementData = buildMeasurementData(allData);
                    renderHeader();
                    applySearch('');
                    const nVars = new Set(allData.map(r => r['variable name'])).size;
                    statusEl.textContent = `${measurementData.length.toLocaleString()} measurements \u00b7 ${nVars.toLocaleString()} variable names`;
                },
                error: function(err) { statusEl.textContent = `Failed to load variables: ${err}`; }
            });

            // Search filters measurementData (explanation + any varName + cycles)
            let searchEpoch = 0;
            function applySearch(term) {
                const myEpoch = ++searchEpoch;
                tableBody.innerHTML = '';
                allRowEls = [];
                if (!measurementData.length) return;
                const lower = term ? term.toLowerCase() : '';
                const data = lower
                    ? measurementData.filter(e =>
                        e.explanation.toLowerCase().includes(lower) ||
                        e.varEntries.some(ve =>
                            ve.varName.toLowerCase().includes(lower) ||
                            ve.cycles.some(c => c.includes(lower))))
                    : measurementData;
                const CHUNK = 200;
                appendGroupedBatch(data.slice(0, CHUNK));
                let idx = CHUNK;
                const nVars = new Set(allData.map(r => r['variable name'])).size;
                function streamRest() {
                    if (myEpoch !== searchEpoch) return;
                    if (idx >= data.length) {
                        statusEl.textContent = lower
                            ? `Found ${data.length.toLocaleString()} measurements`
                            : `${measurementData.length.toLocaleString()} measurements \u00b7 ${nVars.toLocaleString()} variable names`;
                        return;
                    }
                    appendGroupedBatch(data.slice(idx, idx + CHUNK));
                    idx += CHUNK;
                    (window.requestIdleCallback || window.requestAnimationFrame)(streamRest);
                }
                (window.requestIdleCallback || window.requestAnimationFrame)(streamRest);
                statusEl.textContent = lower ? `Found ${data.length.toLocaleString()} measurements` : 'Rendering\u2026';
            }
            function debounce(fn, delay) {
                let t;
                return (...args) => {
                    clearTimeout(t);
                    t = setTimeout(() => fn.apply(null, args), delay);
                };
            }
            const onSearch = debounce(() => applySearch(searchInput.value.trim()), 150);
            searchInput.addEventListener('input', onSearch);
            document.getElementById('modal-close-btn').addEventListener('click', closeModal);
            document.getElementById('plot-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
            document.addEventListener('mousedown', function(e) {
                const modal = document.getElementById('plot-modal');
                if (modal.classList.contains('show') && e.target === modal) {
                    closeModal();
                }
            });
            // (Removed document-level click handler for grid-item)
        });
    </script>
</body>
</html>
