<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pandas-nhanes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; margin: 2em; background-color: #f8f9fa; color: #212529; }
        h1, h2 { text-align: left; color: #343a40; margin: 0 0 0.6em; }
        .container { max-width: 1600px; margin: 0 auto; }
        .grid-container {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
            margin-bottom: 3em;
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
        }
        
        .carousel-wrapper {
            display: flex;
            height: 100%;
            align-items: center;
            gap: 30px;
            overflow-y: hidden;
            /* Always visible for instant interaction */
        }
        
        .grid-item {
            background-color: #ffffff;
            border-radius: 12px;
            /* box-shadow removed for no shadow animation */
            position: relative;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            opacity: 0.0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .grid-item.active {
            opacity: 1;
            /* No box-shadow, no transform */
        }

        .grid-item.side {
            opacity: 0.5;
            /* No transform */
        }
        
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #333;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .carousel-nav:hover {
            background: rgba(255,255,255,1);
            transform: translateY(-50%) scale(1.1);
        }
        
        .carousel-nav.prev {
            left: 15px;
        }
        
        .carousel-nav.next {
            right: 15px;
        }
        
        .carousel-indicators {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .indicator.active {
            background: rgba(255,255,255,1);
            transform: scale(1.2);
        }

        /* Full-screen modal styles */
        .plot-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        .plot-modal.show {
            display: flex;
            opacity: 1;
            align-items: center;
            justify-content: center;
        }
        
        .plot-modal-content {
            background-color: #fff;
            border-radius: 12px;
            width: 95vw;
            height: 95vh;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.4, 0.2, 0.2, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .plot-modal.show .plot-modal-content {
            transform: scale(1);
        }
        
        .plot-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }
        
        .plot-modal-close:hover {
            background: rgba(255,255,255,1);
            transform: scale(1.1);
        }
        
        .plot-modal iframe {
            width: 90%;
            height: 90%;
            border: none;
            border-radius: 8px;
            transition: opacity 0.3s ease;
        }
        /* Centered modal iframe with max bounds to avoid taking all space */
        .plot-modal iframe.centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(95vw, 1200px);
            height: min(90vh, 850px);
        }
        .mini-iframe {
            border: none;
            background: #fff;
            border-radius: 8px;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            opacity: 1;
            transform-origin: center center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .mini-iframe.expanding {
            pointer-events: auto !important;
            border-radius: 16px !important;
            opacity: 1 !important;
            transform: scale(1) !important;
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
        .mini-iframe.fading {
            opacity: 0 !important;
            transition: opacity 0.3s ease-in-out;
        }
        .mini-iframe.expanded {
            position: fixed !important;
            left: 50% !important;
            top: 50% !important;
            width: 90vw !important;
            height: 90vh !important;
            z-index: 99999 !important;
            transform: translate(-50%, -50%) scale(1) !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            pointer-events: auto;
            margin: 0;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .mini-iframe-close {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 2vw;
            right: 2vw;
            background: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 2em;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .mini-iframe.expanded ~ .mini-iframe-close {
            display: flex;
        }
        .grid-item a {
            text-decoration: none;
            color: #007bff;
            font-weight: 500;
            font-size: 1.1em;
            margin-top: 0.5em;
            display: inline-block;
        }
        .grid-item a:hover {
            text-decoration: underline;
        }
        #variable-explorer {
            padding: 0;
            margin-bottom: 2.5em;
        }
        #variable-explorer .table-scroll {
            max-height: 600px;
            overflow-y: auto;
            overflow-x: auto;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            background: #fff;
        }
        #search-input {
            width: 100%;
            padding: 0.8em;
            margin-bottom: 1.5em;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8em;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #f1f3f5;
        }
        tbody tr:hover {
            background-color: #f8f9fa;
        }
        /* Table status/loading */
        #table-status { font-size: 0.95em; color: #6c757d; margin: 0.5em 0 1em; }

        /* Responsive tweaks */
        @media (max-width: 768px) {
            body { margin: 1em; }
            .grid-container { height: 260px; padding: 12px; }
            .carousel-wrapper { gap: 16px; }
            .plot-modal-content { width: 100vw; height: 100vh; border-radius: 0; }
            .plot-modal iframe.centered { width: min(100vw, 100%); height: min(100vh, 100%); }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }
        .modal.show {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 85%;
            height: 85%;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .modal.show .modal-content {
            transform: scale(1);
        }
        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-button {
            color: #555;
            align-self: flex-end;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close-button:hover,
        .close-button:focus {
            color: #000;
        }
        .expanding-iframe-overlay {
            position: fixed;
            z-index: 2000;
            background: #fff;
            box-shadow: 0 16px 32px rgba(0,0,0,0.18);
            border-radius: 8px;
            transition: all 0.5s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.3s;
            opacity: 1;
            pointer-events: auto;
        }
        .expanding-iframe-overlay.fullscreen {
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            opacity: 1;
            transform: scale(1) !important;
        }
        .modal-bg {
            display: none;
            position: fixed;
            z-index: 4000;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .modal-bg.show {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .mini-iframe.expanded {
            z-index: 5000 !important;
        }
        .container.modal-active {
            pointer-events: none;
            filter: blur(2px) grayscale(0.2);
        }
        .container.modal-active .mini-iframe.expanded {
            pointer-events: auto;
            filter: none;
        }

        /* ── Correlates modal ── */
        #corr-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.55); z-index: 6000;
            opacity: 0; transition: opacity 0.25s;
        }
        #corr-overlay.open { display: block; opacity: 1; }
        #corr-modal {
            display: none; position: fixed;
            top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.96);
            width: min(860px, 96vw); height: min(88vh, 800px);
            background: #fff; z-index: 6001;
            border-radius: 14px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.25);
            flex-direction: column; overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1), opacity 0.25s;
            opacity: 0;
        }
        #corr-modal.open { display: flex; transform: translate(-50%,-50%) scale(1); opacity: 1; }
        #corr-header {
            padding: 1.1em 1.4em 0.8em; background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5em;
        }
        #corr-header-text { flex: 1; min-width: 0; }
        #corr-title { font-size: 1.15em; font-weight: 700; color: #1a202c; }
        #corr-desc  { margin-top: 0.25em; font-size: 0.85em; color: #4a5568; line-height: 1.4; }
        #corr-detail { font-size: 0.82em; color: #718096; font-style: italic; margin: 0.15em 0 0.05em; line-height: 1.4; display: none; }
        .corr-detail-target { font-size: 0.88em; color: #a0aec0; font-style: normal; }
        .var-detail-sub { font-size: 0.78em; color: #a0aec0; font-style: italic; display: block; margin-top: 2px; }
        #corr-doclink { margin-top: 0.3em; display: inline-block; font-size: 0.82em; color: #3182ce; text-decoration: underline; }
        #corr-close { background: none; border: none; font-size: 1.6em; cursor: pointer; color: #718096; padding: 0; line-height: 1; }
        #corr-close:hover { color: #1a202c; }
        #corr-summary-bar {
            padding: 0.45em 1.2em; background: #fff;
            border-bottom: 1px solid #e2e8f0; font-size: 0.83em;
            color: #718096; flex-shrink: 0;
        }
        #corr-cycle-status { color: #718096; font-size: 0.82em; }
        #corr-body { flex: 1; overflow-y: auto; position: relative; }
        #corr-list { padding: 0; }
        #corr-scatter { display: none; padding: 1em 1.4em; flex-direction: column; align-items: center; height: 100%; overflow: hidden; }
        #corr-scatter.open { display: flex; }
        .corr-scatter-toolbar {
            width: 100%; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 0.5em; flex-wrap: wrap; gap: 0.3em;
        }
        .corr-scatter-title { font-size: 0.95em; font-weight: 700; color: #2d3748; }
        .corr-scatter-stats { font-size: 0.8em; color: #718096; }
        .corr-scatter-btns { display: flex; gap: 0.4em; }
        .corr-scatter-btns button {
            background: #ebf8ff; border: 1px solid #bee3f8;
            border-radius: 4px; color: #2b6cb0; font-size: 0.8em;
            cursor: pointer; padding: 3px 10px;
        }
        .corr-scatter-btns button:hover { background: #bee3f8; }
        #scatter-plot {
            width: 100%; flex: 1; min-height: 380px; max-height: 520px;
        }
        .type-badge {
            display: inline-block; font-size: 0.68em; font-weight: 700;
            padding: 1px 5px; border-radius: 3px; margin-left: 4px;
            vertical-align: middle; letter-spacing: 0.02em;
        }
        .type-r   { background: #ebf8ff; color: #2b6cb0; }
        .type-eta { background: #f0fff4; color: #276749; }
        .type-v   { background: #faf5ff; color: #6b46c1; }
        .plot-badge {
            display: inline-block; font-size: 0.68em; font-weight: 800;
            padding: 1px 6px; border-radius: 4px; margin-top: 4px;
            color: #4a5568; background: #edf2f7; letter-spacing: 0.02em;
        }
        .plot-scatter { background: #ebf8ff; color: #2b6cb0; }
        .plot-box { background: #f0fff4; color: #276749; }
        .plot-heatmap { background: #fffaf0; color: #975a16; }
        .corr-loading-msg, .corr-no-data {
            text-align: center; color: #718096; font-size: 0.95em; padding: 2em 1em;
        }
        .corr-table { width: 100%; border-collapse: collapse; }
        .corr-table tr { content-visibility: auto; contain-intrinsic-size: 36px; }
        .corr-row  { cursor: pointer; transition: background 0.12s; }
        .corr-row:hover  { background: #ebf8ff; }
        .corr-row-scatter { cursor: pointer; transition: background 0.12s; }
        .corr-row-scatter:hover { background: #f0fff4; }
        .corr-rank { width: 2em; text-align: center; color: #a0aec0; font-size: 0.78em; padding: 0.5em 0.3em 0.5em 1em; }
        .corr-varname { font-family: monospace; font-size: 0.85em; font-weight: 700; color: #2d3748; padding: 0.5em 0.3em; white-space: nowrap; }
        .corr-vardesc { font-size: 0.78em; color: #4a5568; padding: 0.5em 0.3em; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .corr-bar-cell { padding: 0.5em 0.5em; white-space: nowrap; }
        .corr-bar  { display: inline-block; height: 8px; border-radius: 4px; opacity: 0.65; vertical-align: middle; min-width: 2px; }
        .corr-r    { font-size: 0.82em; font-weight: 700; margin-left: 5px; vertical-align: middle; }
        .corr-n    { font-size: 0.76em; color: #718096; padding: 0.5em 0.4em; white-space: nowrap; }
        .corr-cycle-values { padding: 0.45em 0.5em; min-width: 290px; }
        .corr-cycle-value {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 6px; margin: 2px 3px 2px 0;
            border: 1px solid #e2e8f0; border-radius: 5px;
            background: #fff; color: #4a5568; font-size: 0.72em;
            white-space: nowrap; cursor: pointer;
        }
        .corr-cycle-value:hover { border-color: #90cdf4; background: #f7fafc; }
        .corr-cycle-value.active { border-color: #63b3ed; background: #ebf8ff; }
        .corr-cycle-value.nonsig { opacity: 0.55; }
        .corr-cycle-name { color: #718096; font-weight: 700; }
        .corr-cycle-assoc { font-weight: 800; }
        .corr-outlier-note { color: #a0aec0; font-size: 0.76em; margin-left: 0.5em; }
        .corr-show-more {
            margin: 0.7em auto 1.2em; display: block;
            border: 1px solid #bee3f8; background: #ebf8ff; color: #2b6cb0;
            border-radius: 5px; padding: 0.45em 0.9em; cursor: pointer;
            font-weight: 700; font-size: 0.82em;
        }
        .corr-show-more:hover { background: #bee3f8; }
        .corr-btn {
            background: #ebf8ff; border: 1px solid #bee3f8;
            border-radius: 4px; color: #2b6cb0;
            font-size: 0.8em; cursor: pointer; padding: 2px 8px;
            transition: background 0.15s; white-space: nowrap;
        }
        .corr-sig-sep td {
            padding: 0.3em 1em; font-size: 0.72em; color: #a0aec0;
            text-align: center; letter-spacing: 0.04em;
            border-top: 1px dashed #e2e8f0; border-bottom: 1px dashed #e2e8f0;
            background: #fafbfc;
        }
        .corr-row-nonsig { opacity: 0.38; cursor: pointer; transition: opacity 0.12s; }
        .corr-row-nonsig:hover { opacity: 0.65; background: #f7fafc; }
        .corr-pval { font-size: 0.72em; color: #a0aec0; margin-left: 5px; vertical-align: middle; }

        /* ── Population filter bar ── */
        #corr-filter-bar {
            display: flex; align-items: center; gap: 0.45em;
            padding: 0.4em 1.2em; background: #f7fafc;
            border-bottom: 1px solid #e2e8f0; flex-wrap: wrap;
            font-size: 0.82em; flex-shrink: 0;
        }
        .flt-label { font-weight: 700; color: #4a5568; margin-right: 0.15em; white-space: nowrap; }
        #corr-filter-bar select {
            font-size: 0.8em; padding: 2px 6px; border: 1px solid #cbd5e0;
            border-radius: 4px; background: #fff; color: #2d3748; cursor: pointer;
        }
        #corr-filter-bar select.flt-active { background: #ebf8ff; border-color: #63b3ed; color: #2b6cb0; font-weight: 700; }
        #flt-reset {
            font-size: 0.78em; padding: 2px 9px; border: 1px solid #fed7d7;
            border-radius: 4px; background: #fff5f5; color: #c53030; cursor: pointer;
            display: none;
        }
        #flt-reset.visible { display: inline-block; }
        #flt-reset:hover { background: #fed7d7; }
        #flt-status { color: #718096; font-style: italic; font-size: 0.82em; margin-left: 0.3em; }

        /* ── Variable explorer grouped table ── */
        .cycle-chip {
            display: inline-block; background: #ebf8ff; color: #2b6cb0;
            font-size: 0.68em; font-weight: 600; padding: 1px 7px;
            border-radius: 10px; margin: 1px 2px; white-space: nowrap;
        }
        .cycles-cell { line-height: 1.8; }
        .var-name-cell { font-family: monospace; font-weight: 700; font-size: 0.88em; white-space: nowrap; padding: 0.8em 0.5em; }
        .var-entry-name { font-family: monospace; font-weight: 700; font-size: 0.8em; color: #2b6cb0; margin-right: 4px; white-space: nowrap; }
        .var-cycles-row { white-space: nowrap; line-height: 2; border-radius: 4px; padding: 0 2px; }
        .var-cycles-row:hover { background: #f0fff4; }
        #variables-table tbody tr { cursor: pointer; transition: background 0.1s; }
        #variables-table tbody tr:hover { background: #ebf8ff; }

        /* ── Distribution panel ── */
        #dist-panel { display: none; padding: 1em 1.4em; flex-direction: column; overflow: hidden; }
        #dist-panel.open { display: flex; }
        .dist-toolbar { display: flex; align-items: center; gap: 0.8em; margin-bottom: 0.6em; flex-wrap: wrap; }
        .dist-toolbar label { font-size: 0.85em; color: #4a5568; font-weight: 600; }
        .dist-toolbar select { font-size: 0.82em; padding: 3px 8px; border: 1px solid #cbd5e0; border-radius: 4px; background: #fff; color: #2d3748; cursor: pointer; }
        #dist-plot { width: 100%; height: 430px; }
        /* ── View toggle (Correlates / Distribution) ── */
        .view-toggle { display: flex; border: 1px solid #cbd5e0; border-radius: 5px; overflow: hidden; flex-shrink: 0; }
        .view-toggle-btn { padding: 4px 14px; font-size: 0.82em; border: none; background: #f7fafc; color: #718096; cursor: pointer; font-weight: 600; transition: background 0.15s, color 0.15s; }
        .view-toggle-btn.active { background: #2b6cb0; color: #fff; }
        .view-toggle-btn:hover:not(.active) { background: #ebf8ff; color: #2b6cb0; }
    </style>
</head>
<body>
    <div class="container">
        <div id="variable-explorer">
            <h2>NHANES Variable Explorer</h2>
            <input type="text" id="search-input" placeholder="Search variables...">
            <div class="table-scroll">
                <table id="variables-table">
                    <thead>
                        <tr id="variables-table-header-row">
                            <!-- Headers will be loaded here -->
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

        <h2>Examples</h2>
        <div class="grid-container" id="grid-container">

    <script>
        // PNG/HTML pairs for carousel and modal – loaded from plots.json (auto-generated by CI)
        let plotExamples = [];
        let currentIndex = 0;
        let plotItems = [];
        
        // No longer loading from plots.txt

// Add images to carousel as they load, show carousel after first image
function loadImagesIndividually(plotExamples, baseWidth = 300) {
    const carouselWrapper = document.getElementById('carousel-wrapper');
    const indicatorsContainer = document.getElementById('carousel-indicators');
    plotItems = [];
    plotExamples.forEach((plot, index) => {
        const img = new window.Image();
        img.src = plot.png;
        img.alt = plot.base;
        img.onload = function() {
            const aspectRatio = img.naturalWidth / img.naturalHeight;
            const thumbnailWidth = baseWidth;
            const thumbnailHeight = Math.round(baseWidth / aspectRatio);
            const gridItem = document.createElement('div');
            gridItem.className = 'grid-item';
            gridItem.dataset.index = index;
            gridItem.style.width = `${thumbnailWidth}px`;
            gridItem.style.height = `${thumbnailHeight}px`;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '100%';
            img.style.objectFit = 'contain';
            img.style.display = 'block';
            img.style.margin = '0 auto';
            gridItem.appendChild(img);
            gridItem.addEventListener('click', function(e) {
                if (!e.target.closest('.indicator') && !e.target.closest('.carousel-nav')) {
                    e.preventDefault();
                    openModalFromTile(gridItem);
                }
            });
            // Insert in correct order
            if (carouselWrapper.children.length > index) {
                carouselWrapper.insertBefore(gridItem, carouselWrapper.children[index]);
            } else {
                carouselWrapper.appendChild(gridItem);
            }
            // Add indicator if not already present
            if (!indicatorsContainer.querySelector(`[data-index="${index}"]`)) {
                const indicator = document.createElement('div');
                indicator.className = 'indicator';
                indicator.dataset.index = index;
                indicator.addEventListener('click', () => goToSlide(index));
                indicatorsContainer.appendChild(indicator);
            }
            plotItems[index] = { element: gridItem, base: plot.base, width: img.naturalWidth, height: img.naturalHeight };
            // Enable horizontal scrolling with snap
            carouselWrapper.style.overflowX = 'auto';
            carouselWrapper.style.scrollSnapType = 'x mandatory';
            carouselWrapper.style.scrollBehavior = 'smooth';
            carouselWrapper.childNodes.forEach(node => {
                if (node.nodeType === 1) node.style.scrollSnapAlign = 'center';
            });
            // Fade in the grid item
            setTimeout(() => {
                gridItem.style.opacity = '0.7';
                if (index === currentIndex) gridItem.classList.add('active');
            }, 10);
            updateCarousel();
        };
        img.onerror = function() {
            // fallback: still add a blank grid item
            const gridItem = document.createElement('div');
            gridItem.className = 'grid-item';
            gridItem.dataset.index = index;
            gridItem.style.width = `${baseWidth}px`;
            gridItem.style.height = `${baseWidth}px`;
            gridItem.textContent = 'Image failed';
            if (carouselWrapper.children.length > index) {
                carouselWrapper.insertBefore(gridItem, carouselWrapper.children[index]);
            } else {
                carouselWrapper.appendChild(gridItem);
            }
            plotItems[index] = { element: gridItem, base: plot.base };
            setTimeout(() => {
                gridItem.style.opacity = '0.7';
                if (index === currentIndex) gridItem.classList.add('active');
            }, 10);
            updateCarousel();
        };
    });
}

        function createPlotThumbnails() {
    const carouselWrapper = document.getElementById('carousel-wrapper');
    const indicatorsContainer = document.getElementById('carousel-indicators');
            // Responsive thumbnail width
            const baseWidth = Math.min(300, Math.max(160, Math.floor(window.innerWidth * 0.7)));
    // Remove any existing children (for reloads)
    carouselWrapper.innerHTML = '';
    indicatorsContainer.innerHTML = '';
    loadImagesIndividually(plotExamples, baseWidth);
}

        function updateCarousel() {
            const wrapper = document.getElementById('carousel-wrapper');
            plotItems.forEach((item, index) => {
                if (!item || !item.element) return;
                const element = item.element;
                element.classList.remove('active', 'side');
                if (index === currentIndex) {
                    element.classList.add('active');
                } else if (Math.abs(index - currentIndex) === 1) {
                    element.classList.add('side');
                }
            });
            document.querySelectorAll('.indicator').forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentIndex);
            });
            // Scroll to the active item if not user scrolling
            if (!wrapper.classList.contains('user-scrolling')) {
                const activeItem = plotItems[currentIndex] && plotItems[currentIndex].element;
                if (activeItem) {
                    activeItem.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }
        }

        function goToSlide(index) {
            if (index >= 0 && index < plotItems.length) {
                currentIndex = index;
                updateCarousel();
            }
        }
        function nextSlide() {
            if (currentIndex < plotItems.length - 1) {
                goToSlide(currentIndex + 1);
            }
        }
        function prevSlide() {
            if (currentIndex > 0) {
                goToSlide(currentIndex - 1);
            }
        }

        // --- Modal logic: show HTML in iframe for expanded view ---
        function openModalFromTile(gridItem) {
            const index = parseInt(gridItem.dataset.index);
            const plot = plotExamples[index];
            if (!plot) return;
            const modal = document.getElementById('plot-modal');
            const modalContent = document.querySelector('.plot-modal-content');
            let modalImg = document.getElementById('modal-img');
            let modalIframe = document.getElementById('modal-iframe');
            // Remove any previous modalImg
            if (modalImg) modalImg.remove();
            // Hide iframe and reset src
            if (modalIframe) {
                modalIframe.style.opacity = '0';
                modalIframe.style.display = 'none';
                modalIframe.src = '';
            }
            // Add PNG image as background
            modalImg = document.createElement('img');
            modalImg.id = 'modal-img';
            modalImg.src = plot.png;
            modalImg.alt = plot.base;
            modalImg.style.position = 'absolute';
            modalImg.style.top = '0';
            modalImg.style.left = '0';
            modalImg.style.width = '100%';
            modalImg.style.height = '100%';
            modalImg.style.objectFit = 'contain';
            modalImg.style.zIndex = '1';
            modalImg.style.transition = 'opacity 0.3s';
            modalImg.style.opacity = '1';
            // Insert image as first child of modalContent
            modalContent.insertBefore(modalImg, modalContent.firstChild);
            // Show modal
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
            // Now load the HTML in the iframe, fade in when loaded
            if (modalIframe && plot.html) {
                modalIframe.src = plot.html;
                modalIframe.style.display = 'block';
                modalIframe.classList.add('centered');
                modalIframe.style.zIndex = '2';
                modalIframe.style.background = 'transparent';
                modalIframe.style.opacity = '0';
                modalIframe.style.transition = 'opacity 0.5s';
                // Size to the image dimensions and scale to fit container
                const dims = plotItems[index] || {};
                if (dims.width && dims.height) {
                    modalIframe.dataset.contentWidth = String(dims.width);
                    modalIframe.dataset.contentHeight = String(dims.height);
                } else {
                    // Fallback defaults
                    modalIframe.dataset.contentWidth = '1200';
                    modalIframe.dataset.contentHeight = '800';
                }
                fitModalIframe();
                // Fade in iframe when loaded, hide PNG
                modalIframe.onload = function() {
                    setTimeout(() => {
                        fitModalIframe();
                        modalIframe.style.opacity = '1';
                        if (modalImg) {
                            modalImg.style.transition = 'opacity 0.5s';
                            modalImg.style.opacity = '0';
                            setTimeout(() => {
                                if (modalImg && modalImg.parentNode) modalImg.parentNode.removeChild(modalImg);
                            }, 500);
                        }
                    }, 50);
                };
            }
        }

        // Compute a scale so the iframe (using PNG dims) fits within modal content, center it
        function fitModalIframe() {
            const modal = document.getElementById('plot-modal');
            if (!modal || !modal.classList.contains('show')) return;
            const modalIframe = document.getElementById('modal-iframe');
            const modalContent = document.querySelector('.plot-modal-content');
            if (!modalIframe || !modalContent) return;
            const contentW = parseFloat(modalIframe.dataset.contentWidth || '1200');
            const contentH = parseFloat(modalIframe.dataset.contentHeight || '800');
            const rect = modalContent.getBoundingClientRect();
            const maxW = rect.width * 0.98;
            const maxH = rect.height * 0.98;
            const scale = Math.min(maxW / contentW, maxH / contentH, 1);
            modalIframe.style.position = 'absolute';
            modalIframe.style.top = '50%';
            modalIframe.style.left = '50%';
            modalIframe.style.width = contentW + 'px';
            modalIframe.style.height = contentH + 'px';
            modalIframe.style.transformOrigin = 'center center';
            modalIframe.style.transform = `translate(-50%, -50%) scale(${scale})`;
            modalIframe.style.willChange = 'transform';
        }
        function closeModal() {
            const modal = document.getElementById('plot-modal');
            const modalImg = document.getElementById('modal-img');
            const modalIframe = document.getElementById('modal-iframe');
            modal.classList.remove('show');
            setTimeout(() => {
                if (modalImg) modalImg.remove();
                if (modalIframe) modalIframe.src = '';
                if (modalIframe) modalIframe.style.display = '';
            }, 300);
            document.body.style.overflow = '';
        }

        // ── Correlates (on-the-fly) ─────────────────────────────────────────
        // One file per cycle: <cycle>.scatter.json
        // Contains sampled raw arrays → JS computes associations on click.
        let varMeta      = {};   // {varName → {desc, docLink}} built from CSV
        let valueLabels  = {};   // {varName → {code_str → label}} from nhanes_value_labels.json
        let varDetails   = {};   // {varName → {english_text, target}} from nhanes_var_details.json
        const scatterCache = {}; // {cycle → scatter JSON}
        let corrManifest  = [];
        let corrActiveVar  = null;
        let corrActiveCycle = null;
        let corrCycleEntries = [];
        let corrCycleSummaries = [];
        let corrSummaryRunId = 0;
        let corrRowsExpanded = false;
        let scatterColX = null, scatterColY = null;

        const SPECIAL_NUMERIC_MISSING = new Set([777, 999, 7777, 9999, 77777, 99999]);
        const SPECIAL_CAT_MISSING = new Set([77, 99, 777, 999, 7777, 9999, 77777, 99999]);

        // ── Data loading ──────────────────────────────────────────────────────
        async function loadManifest() {
            if (corrManifest.length) return corrManifest;
            try {
                const r = await fetch('data/manifest.json');
                if (r.ok) {
                    corrManifest = await r.json();
                    for (const m of corrManifest) m.varSet = new Set(m.vars || []);
                }
            } catch { corrManifest = []; }
            return corrManifest;
        }
        async function loadScatterData(cycle) {
            if (scatterCache[cycle]) return scatterCache[cycle];
            try {
                const r = await fetch(`data/${cycle}.scatter.json`);
                if (!r.ok) return null;
                scatterCache[cycle] = cleanScatterData(await r.json());
                return scatterCache[cycle];
            } catch (err) {
                console.warn(`Could not load scatter data for ${cycle}`, err);
                return null;
            }
        }

        function labelLooksMissing(label) {
            return /refused|don't know|dont know|missing|not ascertained|blank/i.test(String(label || ''));
        }

        function isSpecialMissingValue(col, value, type, uniqueValues) {
            if (value === null) return false;
            const numericValue = Number(value);
            if (!Number.isFinite(numericValue)) return false;
            const absValue = Math.abs(numericValue);
            const labels = valueLabels[col] || {};
            const label = labels[String(value)] || labels[value];
            if (labelLooksMissing(label)) return true;
            if (type === 'num') return SPECIAL_NUMERIC_MISSING.has(absValue);
            if (SPECIAL_CAT_MISSING.has(absValue)) return true;
            if ((absValue === 7 || absValue === 9) && !label && uniqueValues.size <= 6 && (uniqueValues.has('1') || uniqueValues.has('2'))) {
                return true;
            }
            return false;
        }

        function cleanScatterData(scatterData) {
            const colTypes = scatterData.col_types || {};
            const cleanedCounts = {};
            const cleanData = {};
            for (const col of scatterData.cols || []) {
                const type = colTypes[col] || 'num';
                const raw = scatterData.data[col] || [];
                const uniqueValues = new Set(raw.filter(v => v !== null).map(v => String(v)));
                let removed = 0;
                cleanData[col] = raw.map(value => {
                    if (isSpecialMissingValue(col, value, type, uniqueValues)) {
                        removed++;
                        return null;
                    }
                    return value;
                });
                if (removed) cleanedCounts[col] = removed;
            }
            return { ...scatterData, data: cleanData, cleaned_counts: cleanedCounts };
        }

        function isScatterOpen() {
            return document.getElementById('corr-scatter')?.classList.contains('open');
        }

        function updateFilterStatus(rawData, filteredData) {
            const statusEl2 = document.getElementById('flt-status');
            if (!statusEl2) return;
            statusEl2.textContent = filteredData
                ? `${filteredData.n_sample.toLocaleString()} of ${rawData.n_sample.toLocaleString()} in subset`
                : '';
        }

        function setCycleStatus(text) {
            const el = document.getElementById('corr-cycle-status');
            if (el) el.textContent = text || '';
        }

        function escapeHtml(value) {
            return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/"/g, '&quot;');
        }

        function pairAvailableInCycle(cycle) {
            if (!scatterColX || !scatterColY) return true;
            const m = corrManifest.find(x => x.cycle === cycle);
            return !!(m && m.varSet && m.varSet.has(scatterColX) && m.varSet.has(scatterColY));
        }

        function formatPValue(p) {
            return p < 0.0001 ? 'p<0.0001' : `p=${p < 0.01 ? p.toFixed(4) : p.toFixed(3)}`;
        }

        function formatAssocValue(result) {
            if (result.tcode === 0) return `${result.sign >= 0 ? '+' : ''}${result.assoc.toFixed(3)}`;
            return result.assoc.toFixed(3);
        }

        function relationColor(result) {
            if (result.tcode === 0) return result.sign >= 0 ? TYPE_COLORS.r_pos : TYPE_COLORS.r_neg;
            return result.tcode === 1 ? TYPE_COLORS.eta : TYPE_COLORS.V;
        }

        function cycleIndex(cycle) {
            return corrManifest.findIndex(m => m.cycle === cycle);
        }

        function cycleTitleLabel(cycle) {
            const years = String(cycle || '').match(/\d{4}/g);
            return years && years.length ? years[years.length - 1] : cycle;
        }

        function aggregateCycleSummaries(summaries) {
            const byCol = new Map();
            summaries.forEach(summary => {
                summary.results.forEach(result => {
                    if (!byCol.has(result.col)) byCol.set(result.col, []);
                    byCol.get(result.col).push({ ...result, cycle: summary.cycle });
                });
            });
            return [...byCol.entries()].map(([col, cycles]) => {
                cycles.sort((a, b) => cycleIndex(a.cycle) - cycleIndex(b.cycle));
                const significant = cycles.filter(c => c.p < 0.05);
                const strongest = cycles.reduce((best, c) => Math.abs(c.assoc) > Math.abs(best.assoc) ? c : best, cycles[0]);
                const bestP = cycles.reduce((best, c) => c.p < best.p ? c : best, cycles[0]);
                return { col, cycles, significant, strongest, bestP };
            }).sort((a, b) => {
                const aSig = a.significant.length > 0;
                const bSig = b.significant.length > 0;
                if (aSig !== bSig) return aSig ? -1 : 1;
                if (a.bestP.p !== b.bestP.p) return a.bestP.p - b.bestP.p;
                if (b.cycles.length !== a.cycles.length) return b.cycles.length - a.cycles.length;
                return Math.abs(b.strongest.assoc) - Math.abs(a.strongest.assoc);
            });
        }

        function pickCycleForRelation(cycles) {
            return cycles.find(c => c.cycle === corrActiveCycle) || cycles[cycles.length - 1];
        }

        // ── Association measures ──────────────────────────────────────────────
        const MIN_SHARED  = 50;
        const TYPE_LABELS = ['r', 'η', 'V'];
        const TYPE_CSS    = ['type-r', 'type-eta', 'type-v'];
        const TYPE_COLORS = { r_pos:'#2b6cb0', r_neg:'#c53030', eta:'#276749', V:'#6b46c1' };
        const PLOT_LABELS = ['scatter', 'boxplot', 'heatmap'];
        const PLOT_CSS = ['plot-scatter', 'plot-box', 'plot-heatmap'];
        const DEFAULT_CORR_ROW_LIMIT = 650;

        function plotKindForTcode(tcode) {
            return { label: PLOT_LABELS[tcode] || 'plot', css: PLOT_CSS[tcode] || '' };
        }

        function quantile(sortedValues, p) {
            if (!sortedValues.length) return null;
            const idx = (sortedValues.length - 1) * p;
            const lo = Math.floor(idx);
            const hi = Math.ceil(idx);
            if (lo === hi) return sortedValues[lo];
            return sortedValues[lo] + (sortedValues[hi] - sortedValues[lo]) * (idx - lo);
        }

        function robustRange(values) {
            const sorted = values.filter(v => v !== null && Number.isFinite(v)).slice().sort((a, b) => a - b);
            if (sorted.length < 4) return null;
            let lower = quantile(sorted, 0.01);
            let upper = quantile(sorted, 0.99);
            if (lower === null || upper === null) return null;
            if (lower === upper) {
                lower = sorted[0];
                upper = sorted[sorted.length - 1];
            }
            if (lower === upper) return null;
            const pad = (upper - lower) * 0.04;
            const clipped = sorted.filter(v => v < lower || v > upper).length;
            return { range: [lower - pad, upper + pad], lower, upper, clipped };
        }

        function clippedAxisNote(...ranges) {
            const clipped = ranges.reduce((sum, r) => sum + (r ? r.clipped : 0), 0);
            return clipped ? ` · axis 1-99% (${clipped.toLocaleString()} outside view)` : '';
        }

        function cleanedCodeNote(scatterData, ...cols) {
            const cleaned = cols.reduce((sum, col) => sum + ((scatterData.cleaned_counts || {})[col] || 0), 0);
            return cleaned ? ` · ${cleaned.toLocaleString()} coded missing removed` : '';
        }

        function groupStats(values) {
            const sorted = values.filter(v => v !== null && Number.isFinite(v)).slice().sort((a, b) => a - b);
            if (!sorted.length) return { n: 0, mean: 0, median: 0 };
            const mean = sorted.reduce((sum, v) => sum + v, 0) / sorted.length;
            return { n: sorted.length, mean, median: quantile(sorted, 0.5) };
        }

        function sortGroupKeysByMedian(groups) {
            return Object.keys(groups).sort((a, b) => {
                const sa = groupStats(groups[a]);
                const sb = groupStats(groups[b]);
                if (sa.median !== sb.median) return sa.median - sb.median;
                if (sa.mean !== sb.mean) return sa.mean - sb.mean;
                return Number(a) - Number(b);
            });
        }

        // ── P-value helpers ───────────────────────────────────────────────────
        function _normalCDF(x) {
            // Abramowitz & Stegun §26.2.17 — max error 7.5e-8
            const a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;
            const sign = x < 0 ? -1 : 1;
            const t = 1 / (1 + p * Math.abs(x) / Math.SQRT2);
            const y = 1 - (((((a5*t+a4)*t+a3)*t+a2)*t+a1)*t) * Math.exp(-(x*x)/2);
            return 0.5 * (1 + sign * y);
        }
        // Two-tailed t-test p-value (normal approx. — fine for n≥50 always true here)
        function _tPvalue(t, df) { return 2 * (1 - _normalCDF(Math.abs(t))); }
        // Chi-squared survival function via Wilson-Hilferty approximation
        function _chi2P(chi2, df) {
            if (chi2 <= 0 || df <= 0) return 1;
            const x = chi2 / df;
            const z = (Math.pow(x, 1/3) - (1 - 2/(9*df))) / Math.sqrt(2/(9*df));
            return 1 - _normalCDF(z);
        }

        function pearsonR(a, b) {
            let sx=0,sy=0,sxx=0,syy=0,sxy=0,n=0;
            for (let i=0;i<a.length;i++) {
                const x=a[i],y=b[i]; if (x===null||y===null) continue;
                sx+=x; sy+=y; sxx+=x*x; syy+=y*y; sxy+=x*y; n++;
            }
            if (n < MIN_SHARED) return null;
            const d = Math.sqrt((n*sxx-sx*sx)*(n*syy-sy*sy));
            if (d === 0) return null;
            const r = (n*sxy-sx*sy)/d;
            const t = r * Math.sqrt(n-2) / Math.sqrt(Math.max(1e-12, 1 - r*r));
            return { assoc: Math.round(r * 1000)/1000, n, tcode: 0, p: _tPvalue(t, n-2) };
        }

        function etaSquared(numArr, catArr) {
            const groups = new Map();
            let total=0, totalN=0;
            for (let i=0;i<numArr.length;i++) {
                const x=numArr[i],c=catArr[i]; if (x===null||c===null) continue;
                if (!groups.has(c)) groups.set(c,[]);
                groups.get(c).push(x); total+=x; totalN++;
            }
            if (totalN < MIN_SHARED || groups.size < 2) return null;
            const gMean = total/totalN;
            let ssB=0,ssT=0;
            for (const [,vals] of groups) {
                const m = vals.reduce((a,v)=>a+v,0)/vals.length;
                ssB += vals.length*(m-gMean)**2;
                for (const v of vals) ssT += (v-gMean)**2;
            }
            if (ssT===0) return null;
            const eta = Math.sqrt(ssB/ssT);
            // F-test: F = (ssB/(k-1)) / (ssW/(n-k)); for large n, (k-1)*F ~ chi2(k-1)
            const k = groups.size, ssW = ssT - ssB;
            const F = (ssB / (k-1)) / (Math.max(1e-12, ssW) / (totalN-k));
            return { assoc: Math.round(eta*1000)/1000, n: totalN, tcode: 1, p: _chi2P(F*(k-1), k-1) };
        }

        function cramersV(a, b) {
            const tbl=new Map(), rC=new Map(), cC=new Map(); let n=0;
            for (let i=0;i<a.length;i++) {
                const r=a[i],c=b[i]; if (r===null||c===null) continue;
                const k=r+':'+c; tbl.set(k,(tbl.get(k)||0)+1);
                rC.set(String(r),(rC.get(String(r))||0)+1);
                cC.set(String(c),(cC.get(String(c))||0)+1); n++;
            }
            if (n < MIN_SHARED) return null;
            let chi2=0;
            for (const [k,obs] of tbl) {
                const sep=k.indexOf(':');
                const exp=(rC.get(k.slice(0,sep))*cC.get(k.slice(sep+1)))/n;
                if (exp>0) chi2+=(obs-exp)**2/exp;
            }
            const k=Math.min(rC.size,cC.size); if (k<2) return null;
            const df = (rC.size-1)*(cC.size-1);
            return { assoc: Math.round(Math.sqrt(chi2/(n*(k-1)))*1000)/1000, n, tcode: 2, p: _chi2P(chi2, df) };
        }

        function computeCorrelates(scatterData, varName) {
            const target = scatterData.data[varName];
            if (!target) return [];
            const ct = scatterData.col_types || {};
            const ttype = ct[varName] || 'num';
            const results = [];
            for (const col of scatterData.cols) {
                if (col === varName) continue;
                const other = scatterData.data[col];
                const otype = ct[col] || 'num';
                let res;
                if (ttype==='num' && otype==='num')      res = pearsonR(target, other);
                else if (ttype==='num' && otype==='cat') res = etaSquared(target, other);
                else if (ttype==='cat' && otype==='num') res = etaSquared(other, target);
                else                                     res = cramersV(target, other);
                if (res) results.push({ col, ...res,
                    sign: res.tcode===0 ? Math.sign(res.assoc) : 1 });
            }
            // Sort significant results by p-value, non-significant by |assoc| at bottom
            const SIG = 0.05;
            const sig    = results.filter(r => r.p < SIG).sort((a, b) => a.p - b.p);
            const nonsig = results.filter(r => r.p >= SIG).sort((a, b) => Math.abs(b.assoc) - Math.abs(a.assoc));
            return [...sig, ...nonsig];
        }

        // ── Show modal ────────────────────────────────────────────────────────
        async function showCorrelates(varName, varDesc, varDocLink, preferredCycle) {
            corrActiveVar = varName;
            scatterColX = null;
            scatterColY = null;
            corrCycleEntries = [];
            corrCycleSummaries = [];
            corrSummaryRunId++;
            corrRowsExpanded = false;
            setCycleStatus('Loading relationships...');
            document.getElementById('corr-title').textContent = varName;
            document.getElementById('corr-desc').textContent  = varDesc || '';
            // Detailed description from nhanes_var_details.json
            const detailEl = document.getElementById('corr-detail');
            const det = varDetails[varName];
            if (detailEl && det) {
                const et  = (det.english_text || '').trim();
                const tgt = (det.target || '').trim();
                const showET = et && et.toLowerCase() !== (varDesc || '').toLowerCase();
                detailEl.innerHTML =
                    (showET ? `<span>${et}</span>` : '') +
                    (tgt ? `<span class="corr-detail-target"${showET ? ' style="margin-left:0.5em"' : ''}>${tgt}</span>` : '');
                detailEl.style.display = (showET || tgt) ? '' : 'none';
            } else if (detailEl) {
                detailEl.style.display = 'none';
            }
            const docA = document.getElementById('corr-doclink');
            docA.href = varDocLink || '#'; docA.style.display = varDocLink ? '' : 'none';
            document.getElementById('corr-list').innerHTML = '<div class="corr-loading-msg">Loading…</div>';
            document.getElementById('corr-scatter').classList.remove('open');
            document.getElementById('corr-list').style.display = '';
            switchViewMode('correlates');
            document.getElementById('corr-overlay').classList.add('open');
            document.getElementById('corr-modal').classList.add('open');
            document.body.style.overflow = 'hidden';

            const manifest = await loadManifest();
            if (!manifest.length) {
                setCycleStatus('No cycle data available');
                document.getElementById('corr-list').innerHTML =
                    '<p class="corr-no-data">No cycle data available. Run <code>python3 build_cycle_data.py</code> first.</p>';
                return;
            }

            const cyclesWithVar = manifest.filter(m => m.varSet.has(varName));
            if (!cyclesWithVar.length) {
                setCycleStatus('Variable not in built cycle data');
                document.getElementById('corr-list').innerHTML =
                    `<p class="corr-no-data"><b>${varName}</b> is not in the dataset.<br><br>` +
                    `<span style="font-size:0.88em;color:#718096;">` +
                    `This happens when the variable is non-numeric, has fewer than 100 observations, ` +
                    `or its cycle hasn't been built yet. ` +
                    `${manifest.length} cycles · ` +
                    `${manifest.reduce((s,m)=>s+(m.n_cols||0),0).toLocaleString()} variables total.</span></p>`;
                return;
            }
            corrCycleEntries = cyclesWithVar;

            const defaultCycle = cyclesWithVar.find(m => m.cycle === preferredCycle)
                ? preferredCycle : cyclesWithVar[cyclesWithVar.length-1].cycle;
            selectCorrelationCycle(defaultCycle);
        }

        async function selectCorrelationCycle(cycle) {
            corrActiveCycle = cycle;
            if (corrViewMode === 'distribution') {
                refreshDistribution();
                return;
            }
            if (isScatterOpen() && scatterColX && scatterColY) {
                await drawScatterFromCache();
                return;
            }
            document.getElementById('corr-scatter').classList.remove('open');
            const listEl = document.getElementById('corr-list');
            listEl.style.display = '';
            await hydrateCorrelationSummary(corrCycleEntries, cycle);
        }

        async function hydrateCorrelationSummary(cyclesWithVar, preferredCycle) {
            const runId = ++corrSummaryRunId;
            corrCycleSummaries = [];
            const listEl = document.getElementById('corr-list');
            listEl.innerHTML = '<div class="corr-loading-msg">Loading relationships across cycles…</div>';
            setCycleStatus(`Loading 0/${cyclesWithVar.length} cycles`);

            const orderedCycles = [...cyclesWithVar].sort((a, b) => {
                if (a.cycle === preferredCycle) return -1;
                if (b.cycle === preferredCycle) return 1;
                return cycleIndex(a.cycle) - cycleIndex(b.cycle);
            });

            let lastRender = 0;
            for (const m of orderedCycles) {
                const t0 = performance.now();
                const data = await loadScatterData(m.cycle);
                if (runId !== corrSummaryRunId) return;
                if (!data || !data.data[corrActiveVar]) continue;
                const filtered = applyPopFilter(data);
                const workData = filtered || data;
                if (m.cycle === corrActiveCycle) updateFilterStatus(data, filtered);
                const results = computeCorrelates(workData, corrActiveVar);
                corrCycleSummaries.push({ cycle: m.cycle, results, scatterData: workData, ms: Math.round(performance.now() - t0) });
                const now = performance.now();
                if (corrCycleSummaries.length === 1 || now - lastRender > 500 || corrCycleSummaries.length === orderedCycles.length) {
                    renderCorrSummaryTable(corrCycleSummaries, cyclesWithVar.length, true);
                    lastRender = now;
                    await new Promise(resolve => requestAnimationFrame(resolve));
                }
            }

            if (runId !== corrSummaryRunId) return;
            renderCorrSummaryTable(corrCycleSummaries, cyclesWithVar.length, false);
        }

        function renderCorrSummaryTable(summaries, totalCycles, loading) {
            const listEl = document.getElementById('corr-list');
            listEl.innerHTML = '';
            const allRows = aggregateCycleSummaries(summaries);
            const rows = corrRowsExpanded ? allRows : allRows.slice(0, DEFAULT_CORR_ROW_LIMIT);
            const SIG = 0.05;
            const nSigRows = allRows.filter(row => row.significant.length).length;
            const loadedCycles = summaries.length;
            setCycleStatus(loading
                ? `Loaded ${loadedCycles}/${totalCycles} cycles`
                : `${allRows.length.toLocaleString()} relationships across ${loadedCycles}/${totalCycles} cycles`);

            const info = document.createElement('div');
            info.style.cssText = 'padding:0.5em 1.2em;font-size:0.78em;color:#718096;display:flex;gap:1em;align-items:center;flex-wrap:wrap;';
            info.innerHTML =
                `<span>${nSigRows.toLocaleString()} variables significant in at least one cycle · ${allRows.length.toLocaleString()} related variables</span>` +
                `<span>${loadedCycles}/${totalCycles} cycles loaded${loading ? ' · loading more...' : ''}</span>` +
                (!corrRowsExpanded && allRows.length > rows.length ? `<span>showing top ${rows.length.toLocaleString()}</span>` : '');
            listEl.appendChild(info);

            if (!allRows.length) {
                const empty = document.createElement('p');
                empty.className = 'corr-no-data';
                empty.textContent = loading
                    ? 'Looking for relationships in available cycles...'
                    : 'No relationships met the shared-data threshold for this subset.';
                listEl.appendChild(empty);
                return;
            }

            const tbl = document.createElement('table');
            tbl.className = 'corr-table';

            let sepInserted = false;
            rows.forEach((row, idx) => {
                if (!sepInserted && !row.significant.length) {
                    sepInserted = true;
                    const sepTr = document.createElement('tr');
                    sepTr.className = 'corr-sig-sep';
                    sepTr.innerHTML = '<td colspan="5">not significant in loaded cycles (p ≥ 0.05)</td>';
                    tbl.appendChild(sepTr);
                }

                const desc = (varMeta[row.col] && varMeta[row.col].desc) || row.col;
                const shortD = desc.length > 50 ? desc.slice(0, 50) + '\u2026' : desc;
                const chosen = pickCycleForRelation(row.cycles);
                const color = relationColor(row.strongest);
                const absA = Math.abs(row.strongest.assoc);
                const colType = TYPE_LABELS[row.strongest.tcode];
                const plotKind = plotKindForTcode(row.strongest.tcode);
                const catBadge = row.strongest.tcode !== 0
                    ? ` <span style="font-size:0.68em;color:#a0aec0">${colType}</span>` : '';
                const cycleValues = row.cycles.map(cycleResult => {
                    const activeClass = cycleResult.cycle === corrActiveCycle ? ' active' : '';
                    const sigClass = cycleResult.p < SIG ? '' : ' nonsig';
                    const assocText = formatAssocValue(cycleResult);
                    return `<span class="corr-cycle-value${activeClass}${sigClass}" data-cycle="${escapeAttr(cycleResult.cycle)}" title="Open ${escapeAttr(cycleResult.cycle)} · ${escapeAttr(formatPValue(cycleResult.p))} · n=${cycleResult.n.toLocaleString()}">` +
                        `<span class="corr-cycle-name">${escapeHtml(cycleResult.cycle)}</span>` +
                        `<span class="corr-cycle-assoc" style="color:${relationColor(cycleResult)}">${assocText}</span>` +
                        `<span class="type-badge ${TYPE_CSS[cycleResult.tcode]}">${TYPE_LABELS[cycleResult.tcode]}</span>` +
                        `</span>`;
                }).join('');

                const tr = document.createElement('tr');
                tr.dataset.col = row.col;
                tr.dataset.cycle = chosen.cycle;
                tr.className = row.significant.length ? 'corr-row-scatter' : 'corr-row-nonsig';
                tr.title = chosen.cycle === corrActiveCycle
                    ? 'Click to view chart for the active cycle'
                    : `Click to view chart in ${chosen.cycle}; this pair is not available in the active cycle`;
                tr.innerHTML = `
                    <td class="corr-rank">${idx+1}</td>
                    <td class="corr-varname">${escapeHtml(row.col)}${catBadge}<br><span class="plot-badge ${plotKind.css}">${plotKind.label}</span></td>
                    <td class="corr-vardesc" title="${escapeAttr(desc)}">${escapeHtml(shortD)}</td>
                    <td class="corr-cycle-values">${cycleValues}</td>
                    <td class="corr-bar-cell">
                        <div class="corr-bar" style="width:${Math.round(absA*100)}px;background:${color}"></div>
                        <span class="corr-r" style="color:${color}">${formatAssocValue(row.strongest)}</span>
                    </td>`;
                tbl.appendChild(tr);
            });
            tbl.addEventListener('click', event => {
                const rowEl = event.target.closest('tr[data-col]');
                if (!rowEl) return;
                const cycleEl = event.target.closest('[data-cycle]');
                openScatter(corrActiveVar, rowEl.dataset.col, cycleEl ? cycleEl.dataset.cycle : rowEl.dataset.cycle);
            });
            listEl.appendChild(tbl);

            if (!corrRowsExpanded && allRows.length > rows.length) {
                const btn = document.createElement('button');
                btn.className = 'corr-show-more';
                btn.textContent = `Show all ${allRows.length.toLocaleString()} relationships`;
                btn.addEventListener('click', () => {
                    corrRowsExpanded = true;
                    renderCorrSummaryTable(corrCycleSummaries, corrCycleEntries.length, false);
                });
                listEl.appendChild(btn);
            }
        }

        // ── Scatter plot ─────────────────────────────────────────────────────
        function openScatter(colA, colB, preferredCycle) {
            scatterColX = colB; scatterColY = colA;
            if (preferredCycle && preferredCycle !== corrActiveCycle) {
                corrActiveCycle = preferredCycle;
            }
            document.getElementById('corr-list').style.display = 'none';
            document.getElementById('corr-scatter').classList.add('open');
            drawScatterFromCache();
        }

        async function drawScatterFromCache() {
            const panel = document.getElementById('scatter-plot');
            panel.innerHTML = '<div class="corr-loading-msg">Loading scatter data…</div>';
            if (window.Plotly) Plotly.purge('scatter-plot');
            try {
                const scatter = await loadScatterData(corrActiveCycle);
                if (!scatter) {
                    panel.innerHTML = '<p class="corr-no-data">Scatter data not available for this cycle.</p>';
                    setCycleStatus('No scatter file for this cycle');
                    return;
                }
                const filtered = applyPopFilter(scatter);
                updateFilterStatus(scatter, filtered);
                const workData = filtered || scatter;
                await drawScatter(workData);
            } catch (err) {
                console.warn('Could not draw scatter plot', err);
                panel.innerHTML = '<p class="corr-no-data">Scatter plot could not be drawn for this selection.</p>';
                setCycleStatus('Chart unavailable');
            }
        }

        async function drawScatter(scatterData) {
            const panel = document.getElementById('scatter-plot');
            const dataX = scatterData.data[scatterColX];
            const dataY = scatterData.data[scatterColY];
            const colTypes = scatterData.col_types || {};
            if (!dataX || !dataY) {
                const missing = [scatterColX, scatterColY].filter(col => !scatterData.data[col]).join(', ');
                panel.innerHTML = `<p class="corr-no-data"><b>${missing}</b> not available in ${corrActiveCycle} data.</p>`;
                document.getElementById('scatter-title').textContent = `${cycleTitleLabel(corrActiveCycle)}: ${scatterColY} × ${scatterColX}`;
                document.getElementById('scatter-stats').textContent = 'Choose another cycle or correlate.';
                setCycleStatus('Pair not available in this cycle');
                return;
            }
            setCycleStatus(pairAvailableInCycle(corrActiveCycle) ? '' : 'Pair not available in this cycle');
            const typeX = colTypes[scatterColX] || 'num';
            const typeY = colTypes[scatterColY] || 'num';
            const metaX = varMeta[scatterColX] || {};
            const metaY = varMeta[scatterColY] || {};
            const xLabel = `${scatterColX}${metaX.desc ? ' — ' + metaX.desc.slice(0,40) : ''}`;
            const yLabel = `${scatterColY}${metaY.desc ? ' — ' + metaY.desc.slice(0,40) : ''}`;

            const xs = [], ys = [];
            for (let i = 0; i < dataX.length; i++) {
                if (dataX[i] !== null && dataY[i] !== null) { xs.push(dataX[i]); ys.push(dataY[i]); }
            }

            document.getElementById('scatter-title').textContent = `${cycleTitleLabel(corrActiveCycle)}: ${scatterColY} × ${scatterColX}`;

            if (xs.length < 2) {
                document.getElementById('scatter-plot').innerHTML =
                    '<p style="padding:50px;text-align:center;color:#718096">Not enough shared sampled points.</p>';
                return;
            }

            const cfg = { responsive: true, displayModeBar: true,
                          modeBarButtonsToRemove: ['toImage', 'sendDataToCloud'],
                          displaylogo: false };
            const baseLayout = {
                margin: { t: 20, r: 20, b: 80, l: 80 },
                paper_bgcolor: '#fafbfc', plot_bgcolor: '#fafbfc',
                font: { family: 'system-ui, -apple-system, sans-serif', size: 11 },
                showlegend: false
            };

            if (typeX === 'num' && typeY === 'num') {
                // Scatter + OLS regression line
                let sx=0,sy=0,sxx=0,syy=0,sxy=0;
                const nn = xs.length;
                for (let i=0;i<nn;i++){sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];syy+=ys[i]*ys[i];sxy+=xs[i]*ys[i];}
                const denom = Math.sqrt((nn*sxx-sx*sx)*(nn*syy-sy*sy));
                const r = denom ? (nn*sxy-sx*sy)/denom : 0;
                const slope = (nn*sxx-sx*sx) ? (nn*sxy-sx*sy)/(nn*sxx-sx*sx) : 0;
                const intercept = sy/nn - slope*(sx/nn);
                const rangeX = robustRange(xs);
                const rangeY = robustRange(ys);
                const xMin = rangeX ? rangeX.range[0] : Math.min(...xs);
                const xMax = rangeX ? rangeX.range[1] : Math.max(...xs);
                document.getElementById('scatter-stats').textContent =
                    `Pearson r = ${r>=0?'+':''}${r.toFixed(3)}  ·  n = ${nn.toLocaleString()}` +
                    clippedAxisNote(rangeX, rangeY) + cleanedCodeNote(scatterData, scatterColX, scatterColY);
                await Plotly.react('scatter-plot', [
                    { x: xs, y: ys, type: 'scatter', mode: 'markers', name: 'Data',
                      marker: { size: 5, opacity: 0.35, color: '#3182ce' },
                      hovertemplate: `${scatterColX}: %{x:.3g}<br>${scatterColY}: %{y:.3g}<extra></extra>` },
                    { x: [xMin, xMax], y: [slope*xMin+intercept, slope*xMax+intercept],
                      type: 'scatter', mode: 'lines', name: 'OLS',
                      line: { color: '#e53e3e', width: 2.5 }, hoverinfo: 'skip' }
                ], { ...baseLayout,
                     xaxis: { title: xLabel, automargin: true, ...(rangeX ? { range: rangeX.range } : {}) },
                     yaxis: { title: yLabel, automargin: true, ...(rangeY ? { range: rangeY.range } : {}) } }, cfg);

            } else if (typeX === 'cat' && typeY === 'num') {
                // Box plot: X = category groups, Y = numeric
                const groups = {};
                for (let i = 0; i < xs.length; i++) {
                    const k = String(xs[i]);
                    if (!(k in groups)) groups[k] = [];
                    groups[k].push(ys[i]);
                }
                const cats = sortGroupKeysByMedian(groups);
                const labX = getLabels(scatterColX);
                const rangeY = robustRange(ys);
                document.getElementById('scatter-stats').textContent =
                    `η association  ·  n = ${xs.length.toLocaleString()}  ·  ${cats.length} categories sorted by median` +
                    clippedAxisNote(rangeY) + cleanedCodeNote(scatterData, scatterColX, scatterColY);
                await Plotly.react('scatter-plot',
                    cats.map(cat => ({
                        y: groups[cat], type: 'box', name: applyLabel(labX, cat),
                        boxpoints: groups[cat].length <= 300 ? 'outliers' : false,
                        marker: { size: 3, opacity: 0.5, color: '#3182ce' }
                    })),
                    { ...baseLayout,
                      xaxis: { title: xLabel },
                                            yaxis: { title: yLabel, automargin: true, ...(rangeY ? { range: rangeY.range } : {}) } }, cfg);

            } else if (typeX === 'num' && typeY === 'cat') {
                // Horizontal box plot: Y = category groups, X = numeric
                const groups = {};
                for (let i = 0; i < ys.length; i++) {
                    const k = String(ys[i]);
                    if (!(k in groups)) groups[k] = [];
                    groups[k].push(xs[i]);
                }
                const cats = sortGroupKeysByMedian(groups);
                const labY = getLabels(scatterColY);
                const rangeX = robustRange(xs);
                document.getElementById('scatter-stats').textContent =
                    `η association  ·  n = ${xs.length.toLocaleString()}  ·  ${cats.length} categories sorted by median` +
                    clippedAxisNote(rangeX) + cleanedCodeNote(scatterData, scatterColX, scatterColY);
                await Plotly.react('scatter-plot',
                    cats.map(cat => ({
                        x: groups[cat], type: 'box', name: applyLabel(labY, cat), orientation: 'h',
                        boxpoints: groups[cat].length <= 300 ? 'outliers' : false,
                        marker: { size: 3, opacity: 0.5, color: '#3182ce' }
                    })),
                    { ...baseLayout,
                                            xaxis: { title: xLabel, automargin: true, ...(rangeX ? { range: rangeX.range } : {}) },
                      yaxis: { title: yLabel } }, cfg);

            } else {
                // Both categorical: contingency heatmap
                const rowCats = [...new Set(ys.filter(v=>v!==null))].map(Number).sort((a,b)=>a-b);
                const colCats = [...new Set(xs.filter(v=>v!==null))].map(Number).sort((a,b)=>a-b);
                const labX = getLabels(scatterColX);
                const labY = getLabels(scatterColY);
                const xLabels = colCats.map(c => applyLabel(labX, c));
                const yLabels = rowCats.map(r => applyLabel(labY, r));
                const z = rowCats.map(r =>
                    colCats.map(c => {
                        let count = 0;
                        for (let i = 0; i < xs.length; i++) { if (xs[i]===c && ys[i]===r) count++; }
                        return count;
                    })
                );
                document.getElementById('scatter-stats').textContent =
                    `Cramér's V  ·  n = ${xs.length.toLocaleString()}  ·  ${rowCats.length} × ${colCats.length} categories` +
                    cleanedCodeNote(scatterData, scatterColX, scatterColY);
                await Plotly.react('scatter-plot',
                    [{ z, x: xLabels, y: yLabels,
                       type: 'heatmap', colorscale: 'Blues', showscale: true,
                       hovertemplate: `${scatterColX}=%{x}<br>${scatterColY}=%{y}<br>count=%{z}<extra></extra>` }],
                    { ...baseLayout,
                      xaxis: { title: xLabel },
                      yaxis: { title: yLabel, automargin: true } }, cfg);
            }
        }

        function swapScatterAxes() {

        // ── Population subset filter ──────────────────────────────────────────
        function applyPopFilter(scatterData) {
            const sex  = document.getElementById('flt-sex').value;
            const age  = document.getElementById('flt-age').value;
            const race = document.getElementById('flt-race').value;
            const educ = document.getElementById('flt-educ').value;
            const pir  = document.getElementById('flt-pir').value;
            if (!sex && !age && !race && !educ && !pir) return null; // no filter active

            const cols   = scatterData.cols;
            const n      = (scatterData.data[cols[0]] || []).length;
            const sexArr  = scatterData.data['RIAGENDR'];
            const ageArr  = scatterData.data['RIDAGEYR'];
            const raceArr = scatterData.data['RIDRETH1'];
            const educArr = scatterData.data['DMDEDUC2'];
            const pirArr  = scatterData.data['INDFMPIR'];

            const mask = [];
            for (let i = 0; i < n; i++) {
                if (sex  && sexArr  && String(sexArr[i])  !== sex)  continue;
                if (race && raceArr && String(raceArr[i]) !== race) continue;
                if (educ && educArr && String(educArr[i]) !== educ) continue;
                if (age  && ageArr) {
                    if (STRAT_BINS.RIDAGEYR_bin(ageArr[i]) !== age) continue;
                }
                if (pir && pirArr) {
                    if (STRAT_BINS.INDFMPIR_bin(pirArr[i]) !== pir) continue;
                }
                mask.push(i);
            }

            if (!mask.length) return { ...scatterData, n_sample: 0, data: Object.fromEntries(cols.map(c => [c, []])) };

            const filtered = { ...scatterData, n_total: scatterData.n_total, n_sample: mask.length, data: {} };
            for (const col of cols) {
                const arr = scatterData.data[col];
                filtered.data[col] = mask.map(i => arr[i]);
            }
            return filtered;
        }

        // ── Distribution view ─────────────────────────────────────────────────
        let corrViewMode = 'correlates';

        const DIST_PALETTE      = ['#3182ce','#e53e3e','#38a169','#d69e2e','#805ad5','#dd6b20','#319795','#e2748f'];
        const DIST_PALETTE_FILL = [
            'rgba(49,130,206,0.10)','rgba(229,62,62,0.10)','rgba(56,161,105,0.10)','rgba(214,158,46,0.10)',
            'rgba(128,90,213,0.10)','rgba(221,107,32,0.10)','rgba(49,151,149,0.10)','rgba(226,116,143,0.10)'];

        const STRAT_SOURCE = { RIDAGEYR_bin: 'RIDAGEYR', INDFMPIR_bin: 'INDFMPIR' };
        const STRAT_BINS   = {
            RIDAGEYR_bin: v => v === null ? null : v < 18 ? '0–17'  : v < 40 ? '18–39' : v < 60 ? '40–59' : '60+',
            INDFMPIR_bin: v => v === null ? null : v < 1  ? '<1.0'  : v < 2  ? '1–2'   : v < 3  ? '2–3'   : v < 4 ? '3–4' : '≥4',
        };
        const STRAT_ORDER = {
            RIDAGEYR_bin: ['0–17','18–39','40–59','60+'],
            INDFMPIR_bin: ['<1.0','1–2','2–3','3–4','≥4'],
        };
        const STRAT_LABELS = {
            RIAGENDR: { 1:'Male', 2:'Female' },
            RIDRETH1: { 1:'Mexican American', 2:'Other Hispanic', 3:'Non-Hisp White', 4:'Non-Hisp Black', 5:'Other/Multi' },
            DMDEDUC2: { 1:'<9th grade', 2:'9–11th grade', 3:'HS/GED', 4:'Some college', 5:'College+' },
        };

        // Resolve value labels for a column (value_labels JSON → hardcoded strat labels → empty)
        function getLabels(col) {
            return valueLabels[col] || STRAT_LABELS[col] || {};
        }
        function applyLabel(labelMap, code) {
            return labelMap[String(code)] || labelMap[code] || String(code);
        }

        function distStdDev(arr) {
            const n = arr.length;
            if (n < 2) return 1;
            const m = arr.reduce((a, b) => a + b, 0) / n;
            return Math.sqrt(arr.reduce((s, v) => s + (v - m) ** 2, 0) / (n - 1));
        }

        function gaussianKDE(values, h, pts) {
            const sq2pi = Math.sqrt(2 * Math.PI);
            return pts.map(x => {
                let s = 0;
                for (const v of values) { const u = (x - v) / h; s += Math.exp(-0.5 * u * u); }
                return s / (values.length * h * sq2pi);
            });
        }

        function switchViewMode(mode) {
            corrViewMode = mode;
            const btnC = document.getElementById('btn-view-correlates');
            const btnD = document.getElementById('btn-view-dist');

            if (btnD) btnD.classList.toggle('active', mode === 'distribution');

                if (corrList)  corrList.style.display  = 'none';
                if (corrScat)  corrScat.classList.remove('open');

                refreshDistribution();
            } else {
                if (distPanel) distPanel.classList.remove('open');
                if (corrList)  corrList.style.display  = '';
            }
        }

        async function refreshDistribution() {
