<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pandas-nhanes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; margin: 2em; background-color: #f8f9fa; color: #212529; }
        h1, h2 { text-align: center; color: #343a40; }
        .container { max-width: 1200px; margin: 0 auto; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2em;
            margin-bottom: 3em;
            justify-content: center;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        .grid-item {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 0;
            display: flex;
            position: relative;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
            overflow: hidden;
        }
        .grid-item.expanding {
            position: fixed !important;
            left: 50% !important;
            top: 50% !important;
            width: 95vw !important;
            height: 95vh !important;
            transform: translate(-50%, -50%) !important;
            z-index: 99999 !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25) !important;
        }
        .grid-item.expanding::after {
            content: '×';
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #666;
            cursor: pointer;
            z-index: 100000;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .grid-item.expanding::after:hover {
            background: rgba(255,255,255,1);
            color: #333;
        }
        .mini-iframe {
            border: none;
            background: #fff;
            border-radius: 8px;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            opacity: 1;
            transform-origin: top left;
            position: absolute;
            top: 0;
            left: 0;
        }
        .mini-iframe.expanding {
            pointer-events: auto !important;
            border-radius: 16px !important;
            opacity: 1 !important;
            transform: scale(1) !important;
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
        .mini-iframe.fading {
            opacity: 0 !important;
            transition: opacity 0.3s ease-in-out;
        }
        .mini-iframe.expanded {
            position: fixed !important;
            left: 50% !important;
            top: 50% !important;
            width: 90vw !important;
            height: 90vh !important;
            z-index: 99999 !important;
            transform: translate(-50%, -50%) scale(1) !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            pointer-events: auto;
            margin: 0;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .mini-iframe-close {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 2vw;
            right: 2vw;
            background: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 2em;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .mini-iframe.expanded ~ .mini-iframe-close {
            display: flex;
        }
        .grid-item a {
            text-decoration: none;
            color: #007bff;
            font-weight: 500;
            font-size: 1.1em;
            margin-top: 0.5em;
            display: inline-block;
        }
        .grid-item a:hover {
            text-decoration: underline;
        }
        #variable-explorer {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 2em;
        }
        #variable-explorer .table-scroll {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
        }
        #search-input {
            width: 100%;
            padding: 0.8em;
            margin-bottom: 1.5em;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8em;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #f1f3f5;
        }
        tbody tr:hover {
            background-color: #f8f9fa;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }
        .modal.show {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 85%;
            height: 85%;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .modal.show .modal-content {
            transform: scale(1);
        }
        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-button {
            color: #555;
            align-self: flex-end;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close-button:hover,
        .close-button:focus {
            color: #000;
        }
        .expanding-iframe-overlay {
            position: fixed;
            z-index: 2000;
            background: #fff;
            box-shadow: 0 16px 32px rgba(0,0,0,0.18);
            border-radius: 8px;
            transition: all 0.5s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.3s;
            opacity: 1;
            pointer-events: auto;
        }
        .expanding-iframe-overlay.fullscreen {
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            opacity: 1;
            transform: scale(1) !important;
        }
        .modal-bg {
            display: none;
            position: fixed;
            z-index: 4000;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .modal-bg.show {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .mini-iframe.expanded {
            z-index: 5000 !important;
        }
        .container.modal-active {
            pointer-events: none;
            filter: blur(2px) grayscale(0.2);
        }
        .container.modal-active .mini-iframe.expanded {
            pointer-events: auto;
            filter: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>pandas-nhanes</h1>
        
        <div class="grid-container" id="grid-container">
            <!-- Plot thumbnails will be automatically generated here -->
        </div>

        <div id="variable-explorer">
            <h2>NHANES Variable Explorer</h2>
            <input type="text" id="search-input" placeholder="Search variables...">
            <div class="table-scroll">
                <table id="variables-table">
                    <thead>
                        <tr>
                            <th>Variable Name</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Plot dimensions extracted from Plotly configurations
        const plotDimensions = {
            'BMD_Age_Gender.html': { width: 1000, height: 2000 },
            'Cholesterol_Age.html': { width: 800, height: 1200 },
            'Estradiol_Age_Gender.html': { width: 1000, height: 600 },
            'Testosterone_Age_Gender.html': { width: 1000, height: 600 },
            'Testosterone_Estrogen_Ratio.html': { width: 1000, height: 600 }
        };

        // Function to create thumbnails with proper aspect ratios and scaling
        function createPlotThumbnails() {
            const gridContainer = document.getElementById('grid-container');
            const baseWidth = 300; // Base thumbnail width
            
            Object.entries(plotDimensions).forEach(([filename, dimensions]) => {
                const aspectRatio = dimensions.width / dimensions.height;
                const thumbnailWidth = baseWidth;
                const thumbnailHeight = Math.round(baseWidth / aspectRatio);
                
                // Create the grid item
                const gridItem = document.createElement('div');
                gridItem.className = 'grid-item';
                gridItem.style.width = `${thumbnailWidth}px`;
                gridItem.style.height = `${thumbnailHeight}px`;
                
                // Create the iframe with proper scaling
                const iframe = document.createElement('iframe');
                iframe.className = 'mini-iframe';
                iframe.src = `Examples/${filename}`;
                iframe.width = dimensions.width;
                iframe.height = dimensions.height;
                
                // Calculate scale to fit the plot nicely in the thumbnail
                const scaleX = thumbnailWidth / dimensions.width;
                const scaleY = thumbnailHeight / dimensions.height;
                const scale = Math.min(scaleX, scaleY);
                
                iframe.style.transform = `scale(${scale})`;
                iframe.style.transformOrigin = 'top left';
                iframe.style.width = `${dimensions.width}px`;
                iframe.style.height = `${dimensions.height}px`;
                
                gridItem.appendChild(iframe);
                gridContainer.appendChild(gridItem);
                
                // Add click handler for modal expansion
                gridItem.addEventListener('click', () => {
                    openModal(filename);
                });
            });
        }

        document.addEventListener("DOMContentLoaded", function() {
            // Generate plot thumbnails automatically
            createPlotThumbnails();
            
            const searchInput = document.getElementById('search-input');
            const tableBody = document.querySelector('#variables-table tbody');
            let allRows = [];

            Papa.parse('pandas_nhanes/nhanes_variables.csv', {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    data.forEach(row => {
                        if (row['variable name'] && row['variable explanation']) {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `<td>${row['variable name']}</td><td>${row['variable explanation']}</td>`;
                            tableBody.appendChild(tr);
                            allRows.push(tr);
                        }
                    });
                }
            });

            searchInput.addEventListener('keyup', function() {
                const searchTerm = searchInput.value.toLowerCase();
                allRows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    row.style.display = text.includes(searchTerm) ? '' : 'none';
                });
            });

            // Updated modal logic with proper scaling
            function openModalFromTile(gridItem) {
                const miniIframe = gridItem.querySelector('.mini-iframe');
                if (!miniIframe) return;
                
                // Step 1: Fade out the HTML content
                miniIframe.classList.add('fading');
                
                // Step 2: After fade out, scale up container and iframe
                setTimeout(() => {
                    gridItem.classList.add('expanding');
                    miniIframe.classList.add('expanding');
                }, 300);
                
                // Step 3: After scaling is done, fade content back in
                setTimeout(() => {
                    miniIframe.classList.remove('fading');
                }, 600);
            }
            
            function closeModal() {
                const expandedTile = document.querySelector('.grid-item.expanding');
                const expandedIframe = document.querySelector('.mini-iframe.expanding');
                if (!expandedTile || !expandedIframe) return;
                
                // Step 1: Fade out content
                expandedIframe.classList.add('fading');
                
                // Step 2: Scale back down
                setTimeout(() => {
                    expandedTile.classList.remove('expanding');
                    expandedIframe.classList.remove('expanding');
                }, 300);
                
                // Step 3: Fade content back in at small scale
                setTimeout(() => {
                    expandedIframe.classList.remove('fading');
                }, 600);
            }
            
            // Event listeners
            document.addEventListener('click', function(e) {
                const gridItem = e.target.closest('.grid-item');
                if (gridItem) {
                    e.preventDefault();
                    openModalFromTile(gridItem);
                }
            });
            
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
            
            // Optional: clicking outside the expanded iframe closes it
            document.addEventListener('mousedown', function(e) {
                const expandedTile = document.querySelector('.grid-item.expanding');
                if (expandedTile && !expandedTile.contains(e.target)) {
                    closeModal();
                }
            });
        });
    </script>
</body>
</html>
