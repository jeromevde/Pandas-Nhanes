<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pandas-nhanes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; margin: 2em; background-color: #f8f9fa; color: #212529; }
        h1, h2 { text-align: center; color: #343a40; }
        .container { max-width: 1200px; margin: 0 auto; }
        .grid-container {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
            margin-bottom: 3em;
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
        }
        
        .carousel-wrapper {
            display: flex;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            height: 100%;
            align-items: center;
            gap: 30px;
        }
        
        .grid-item {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            position: relative;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0.7;
            transform: scale(0.85);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .grid-item.active {
            opacity: 1;
            transform: scale(1);
            box-shadow: 0 16px 48px rgba(0,0,0,0.25);
        }
        
        .grid-item.side {
            opacity: 0.5;
            transform: scale(0.75);
        }
        
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #333;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .carousel-nav:hover {
            background: rgba(255,255,255,1);
            transform: translateY(-50%) scale(1.1);
        }
        
        .carousel-nav.prev {
            left: 15px;
        }
        
        .carousel-nav.next {
            right: 15px;
        }
        
        .carousel-indicators {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .indicator.active {
            background: rgba(255,255,255,1);
            transform: scale(1.2);
        }

        /* Full-screen modal styles */
        .plot-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        .plot-modal.show {
            display: flex;
            opacity: 1;
            align-items: center;
            justify-content: center;
        }
        
        .plot-modal-content {
            background-color: #fff;
            border-radius: 12px;
            width: 95vw;
            height: 95vh;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.4, 0.2, 0.2, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .plot-modal.show .plot-modal-content {
            transform: scale(1);
        }
        
        .plot-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }
        
        .plot-modal-close:hover {
            background: rgba(255,255,255,1);
            transform: scale(1.1);
        }
        
        .plot-modal iframe {
            width: 90%;
            height: 90%;
            border: none;
            border-radius: 8px;
            transition: opacity 0.3s ease;
        }
        .mini-iframe {
            border: none;
            background: #fff;
            border-radius: 8px;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            opacity: 1;
            transform-origin: center center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .mini-iframe.expanding {
            pointer-events: auto !important;
            border-radius: 16px !important;
            opacity: 1 !important;
            transform: scale(1) !important;
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
        .mini-iframe.fading {
            opacity: 0 !important;
            transition: opacity 0.3s ease-in-out;
        }
        .mini-iframe.expanded {
            position: fixed !important;
            left: 50% !important;
            top: 50% !important;
            width: 90vw !important;
            height: 90vh !important;
            z-index: 99999 !important;
            transform: translate(-50%, -50%) scale(1) !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            pointer-events: auto;
            margin: 0;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .mini-iframe-close {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 2vw;
            right: 2vw;
            background: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 2em;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .mini-iframe.expanded ~ .mini-iframe-close {
            display: flex;
        }
        .grid-item a {
            text-decoration: none;
            color: #007bff;
            font-weight: 500;
            font-size: 1.1em;
            margin-top: 0.5em;
            display: inline-block;
        }
        .grid-item a:hover {
            text-decoration: underline;
        }
        #variable-explorer {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 2em;
        }
        #variable-explorer .table-scroll {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
        }
        #search-input {
            width: 100%;
            padding: 0.8em;
            margin-bottom: 1.5em;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8em;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #f1f3f5;
        }
        tbody tr:hover {
            background-color: #f8f9fa;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }
        .modal.show {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 85%;
            height: 85%;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .modal.show .modal-content {
            transform: scale(1);
        }
        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-button {
            color: #555;
            align-self: flex-end;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close-button:hover,
        .close-button:focus {
            color: #000;
        }
        .expanding-iframe-overlay {
            position: fixed;
            z-index: 2000;
            background: #fff;
            box-shadow: 0 16px 32px rgba(0,0,0,0.18);
            border-radius: 8px;
            transition: all 0.5s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.3s;
            opacity: 1;
            pointer-events: auto;
        }
        .expanding-iframe-overlay.fullscreen {
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            opacity: 1;
            transform: scale(1) !important;
        }
        .modal-bg {
            display: none;
            position: fixed;
            z-index: 4000;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .modal-bg.show {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .mini-iframe.expanded {
            z-index: 5000 !important;
        }
        .container.modal-active {
            pointer-events: none;
            filter: blur(2px) grayscale(0.2);
        }
        .container.modal-active .mini-iframe.expanded {
            pointer-events: auto;
            filter: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>pandas-nhanes</h1>
        
        <div class="grid-container" id="grid-container">
            <button class="carousel-nav prev" id="prev-btn">‹</button>
            <div class="carousel-wrapper" id="carousel-wrapper">
                <!-- Plot thumbnails will be automatically generated here -->
            </div>
            <button class="carousel-nav next" id="next-btn">›</button>
            <div class="carousel-indicators" id="carousel-indicators">
                <!-- Indicators will be generated automatically -->
            </div>
        </div>

        <div id="variable-explorer">
            <h2>NHANES Variable Explorer</h2>
            <input type="text" id="search-input" placeholder="Search variables...">
            <div class="table-scroll">
                <table id="variables-table">
                    <thead>
                        <tr>
                            <th>Variable Name</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Full-screen plot modal -->
    <div id="plot-modal" class="plot-modal">
        <div class="plot-modal-content">
            <button class="plot-modal-close" id="modal-close-btn">&times;</button>
            <iframe id="modal-iframe" src=""></iframe>
        </div>
    </div>

    <script>
        // Plot dimensions extracted from Plotly configurations
        const plotDimensions = {
            'BMD_Age_Gender.html': { width: 1000, height: 2000 },
            'Cholesterol_Age.html': { width: 800, height: 1200 },
            'Estradiol_Age_Gender.html': { width: 1000, height: 600 },
            'Testosterone_Age_Gender.html': { width: 1000, height: 600 },
            'Testosterone_Estrogen_Ratio.html': { width: 1000, height: 600 }
        };

        // Carousel state management
        let currentIndex = 0;
        let plotItems = [];
        
        // Function to create thumbnails with proper aspect ratios and scaling
        function createPlotThumbnails() {
            const carouselWrapper = document.getElementById('carousel-wrapper');
            const indicatorsContainer = document.getElementById('carousel-indicators');
            const baseWidth = 300; // Base thumbnail width
            plotItems = Object.entries(plotDimensions).map(([filename, dimensions], index) => {
                const aspectRatio = dimensions.width / dimensions.height;
                const thumbnailWidth = baseWidth;
                const thumbnailHeight = Math.round(baseWidth / aspectRatio);
                
                // Create the grid item
                const gridItem = document.createElement('div');
                gridItem.className = 'grid-item';
                gridItem.style.width = `${thumbnailWidth}px`;
                gridItem.style.height = `${thumbnailHeight}px`;
                gridItem.dataset.index = index;
                
                // Create the iframe with proper scaling
                const iframe = document.createElement('iframe');
                iframe.className = 'mini-iframe';
                iframe.src = `Examples/${filename}`;
                iframe.width = dimensions.width;
                iframe.height = dimensions.height;
                
                // Calculate scale to fit the plot nicely in the thumbnail
                const scaleX = thumbnailWidth / dimensions.width;
                const scaleY = thumbnailHeight / dimensions.height;
                const scale = Math.min(scaleX, scaleY);
                
                iframe.style.transform = `translate(-50%, -50%) scale(${scale})`;
                iframe.style.transformOrigin = 'center center';
                iframe.style.width = `${dimensions.width}px`;
                iframe.style.height = `${dimensions.height}px`;
                
                gridItem.appendChild(iframe);
                carouselWrapper.appendChild(gridItem);
                
                // Create indicator
                const indicator = document.createElement('div');
                indicator.className = 'indicator';
                indicator.dataset.index = index;
                indicator.addEventListener('click', () => goToSlide(index));
                indicatorsContainer.appendChild(indicator);
                
                return { element: gridItem, filename, dimensions };
            });
            
            updateCarousel();
        }
        
        function updateCarousel() {
            const wrapper = document.getElementById('carousel-wrapper');
            const itemWidth = 330; // 300px width + 30px gap
            const containerWidth = wrapper.parentElement.clientWidth;
            const centerOffset = (containerWidth - 300) / 2;
            
            // Calculate transform to center the current item
            const translateX = centerOffset - (currentIndex * itemWidth);
            wrapper.style.transform = `translateX(${translateX}px)`;
            
            // Update item states
            plotItems.forEach((item, index) => {
                const element = item.element;
                element.classList.remove('active', 'side');
                
                if (index === currentIndex) {
                    element.classList.add('active');
                } else if (Math.abs(index - currentIndex) === 1) {
                    element.classList.add('side');
                }
            });
            
            // Update indicators
            document.querySelectorAll('.indicator').forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentIndex);
            });
            
            // Update navigation button states
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            prevBtn.style.opacity = currentIndex === 0 ? '0.5' : '1';
            nextBtn.style.opacity = currentIndex === plotItems.length - 1 ? '0.5' : '1';
        }
        
        function goToSlide(index) {
            if (index >= 0 && index < plotItems.length) {
                currentIndex = index;
                updateCarousel();
            }
        }
        
        function nextSlide() {
            if (currentIndex < plotItems.length - 1) {
                goToSlide(currentIndex + 1);
            }
        }
        
        function prevSlide() {
            if (currentIndex > 0) {
                goToSlide(currentIndex - 1);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            // Generate plot thumbnails automatically
            createPlotThumbnails();
            
            // Add carousel navigation event listeners
            document.getElementById('prev-btn').addEventListener('click', prevSlide);
            document.getElementById('next-btn').addEventListener('click', nextSlide);
            
            // Add keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    prevSlide();
                } else if (e.key === 'ArrowRight') {
                    nextSlide();
                } else if (e.key === 'Escape') {
                    closeModal();
                }
            });
            
            // Add touch/swipe support for mobile
            let startX = 0;
            let startY = 0;
            const carousel = document.getElementById('grid-container');
            
            carousel.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });
            
            carousel.addEventListener('touchend', (e) => {
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                const diffX = startX - endX;
                const diffY = startY - endY;
                
                // Only trigger swipe if horizontal movement is greater than vertical
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        nextSlide(); // Swipe left = next
                    } else {
                        prevSlide(); // Swipe right = prev
                    }
                }
            });
            
            // Auto-resize carousel on window resize
            window.addEventListener('resize', () => {
                updateCarousel();
            });
            
            const searchInput = document.getElementById('search-input');
            const tableBody = document.querySelector('#variables-table tbody');
            let allRows = [];

            Papa.parse('pandas_nhanes/nhanes_variables.csv', {
                download: true,
                header: true,
                complete: function(results) {
                    const data = results.data;
                    data.forEach(row => {
                        if (row['variable name'] && row['variable explanation']) {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `<td>${row['variable name']}</td><td>${row['variable explanation']}</td>`;
                            tableBody.appendChild(tr);
                            allRows.push(tr);
                        }
                    });
                }
            });

            searchInput.addEventListener('keyup', function() {
                const searchTerm = searchInput.value.toLowerCase();
                allRows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    row.style.display = text.includes(searchTerm) ? '' : 'none';
                });
            });            
            // Full-screen modal functionality
            function openModalFromTile(gridItem) {
                const iframe = gridItem.querySelector('.mini-iframe');
                if (!iframe) return;
                
                const modal = document.getElementById('plot-modal');
                const modalIframe = document.getElementById('modal-iframe');
                
                // Set the iframe source to the same as the clicked item
                modalIframe.src = iframe.src;
                
                // Show the modal
                modal.classList.add('show');
                
                // Simple timeout to ensure iframe is visible
                setTimeout(() => {
                    modalIframe.style.opacity = '1';
                }, 100);
                
                // Prevent body scrolling
                document.body.style.overflow = 'hidden';
            }
            
            function closeModal() {
                const modal = document.getElementById('plot-modal');
                const modalIframe = document.getElementById('modal-iframe');
                
                modal.classList.remove('show');
                
                // Clear iframe source after animation
                setTimeout(() => {
                    modalIframe.src = '';
                }, 300);
                
                // Restore body scrolling
                document.body.style.overflow = '';
            }
            
            // Add modal event listeners
            document.getElementById('modal-close-btn').addEventListener('click', closeModal);
            document.getElementById('plot-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
            
            // Handle clicks outside expanded modal
            document.addEventListener('mousedown', function(e) {
                const modal = document.getElementById('plot-modal');
                if (modal.classList.contains('show') && e.target === modal) {
                    closeModal();
                }
            });
            
            // Add event delegation for grid item clicks
            document.addEventListener('click', function(e) {
                const gridItem = e.target.closest('.grid-item');
                if (gridItem && !e.target.closest('.carousel-nav') && !e.target.closest('.indicator')) {
                    e.preventDefault();
                    openModalFromTile(gridItem);
                }
            });
        });
    </script>
</body>
</html>
