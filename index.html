<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pandas-nhanes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; margin: 2em; background-color: #f8f9fa; color: #212529; }
        h1, h2 { text-align: center; color: #343a40; }
        .container { max-width: 1200px; margin: 0 auto; }
        .grid-container {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
            margin-bottom: 3em;
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
        }
        
        .carousel-wrapper {
            display: flex;
            height: 100%;
            align-items: center;
            gap: 30px;
            overflow-y: hidden;
            /* Always visible for instant interaction */
        }
        
        .grid-item {
            background-color: #ffffff;
            border-radius: 12px;
            /* box-shadow removed for no shadow animation */
            position: relative;
            cursor: pointer;
            overflow: hidden;
            flex-shrink: 0;
            opacity: 0.0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .grid-item.active {
            opacity: 1;
            /* No box-shadow, no transform */
        }

        .grid-item.side {
            opacity: 0.5;
            /* No transform */
        }
        
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #333;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        
        .carousel-nav:hover {
            background: rgba(255,255,255,1);
            transform: translateY(-50%) scale(1.1);
        }
        
        .carousel-nav.prev {
            left: 15px;
        }
        
        .carousel-nav.next {
            right: 15px;
        }
        
        .carousel-indicators {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
        }
        
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .indicator.active {
            background: rgba(255,255,255,1);
            transform: scale(1.2);
        }

        /* Full-screen modal styles */
        .plot-modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        
        .plot-modal.show {
            display: flex;
            opacity: 1;
            align-items: center;
            justify-content: center;
        }
        
        .plot-modal-content {
            background-color: #fff;
            border-radius: 12px;
            width: 95vw;
            height: 95vh;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.4, 0.2, 0.2, 1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .plot-modal.show .plot-modal-content {
            transform: scale(1);
        }
        
        .plot-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10001;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }
        
        .plot-modal-close:hover {
            background: rgba(255,255,255,1);
            transform: scale(1.1);
        }
        
        .plot-modal iframe {
            width: 90%;
            height: 90%;
            border: none;
            border-radius: 8px;
            transition: opacity 0.3s ease;
        }
        /* Centered modal iframe with max bounds to avoid taking all space */
        .plot-modal iframe.centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(95vw, 1200px);
            height: min(90vh, 850px);
        }
        .mini-iframe {
            border: none;
            background: #fff;
            border-radius: 8px;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            opacity: 1;
            transform-origin: center center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .mini-iframe.expanding {
            pointer-events: auto !important;
            border-radius: 16px !important;
            opacity: 1 !important;
            transform: scale(1) !important;
            width: 100% !important;
            height: 100% !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
        }
        .mini-iframe.fading {
            opacity: 0 !important;
            transition: opacity 0.3s ease-in-out;
        }
        .mini-iframe.expanded {
            position: fixed !important;
            left: 50% !important;
            top: 50% !important;
            width: 90vw !important;
            height: 90vh !important;
            z-index: 99999 !important;
            transform: translate(-50%, -50%) scale(1) !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            pointer-events: auto;
            margin: 0;
            transition: all 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .mini-iframe-close {
            display: none;
            position: fixed;
            z-index: 10000;
            top: 2vw;
            right: 2vw;
            background: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 2em;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .mini-iframe.expanded ~ .mini-iframe-close {
            display: flex;
        }
        .grid-item a {
            text-decoration: none;
            color: #007bff;
            font-weight: 500;
            font-size: 1.1em;
            margin-top: 0.5em;
            display: inline-block;
        }
        .grid-item a:hover {
            text-decoration: underline;
        }
        #variable-explorer {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 2em;
        }
        #variable-explorer .table-scroll {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: auto;
        }
        #search-input {
            width: 100%;
            padding: 0.8em;
            margin-bottom: 1.5em;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.8em;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #f1f3f5;
        }
        tbody tr:hover {
            background-color: #f8f9fa;
        }
        /* Table status/loading */
        #table-status { font-size: 0.95em; color: #6c757d; margin: 0.5em 0 1em; }

        /* Responsive tweaks */
        @media (max-width: 768px) {
            body { margin: 1em; }
            .grid-container { height: 260px; padding: 12px; }
            .carousel-wrapper { gap: 16px; }
            .plot-modal-content { width: 100vw; height: 100vh; border-radius: 0; }
            .plot-modal iframe.centered { width: min(100vw, 100%); height: min(100vh, 100%); }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
        }
        .modal.show {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 85%;
            height: 85%;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .modal.show .modal-content {
            transform: scale(1);
        }
        .modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-button {
            color: #555;
            align-self: flex-end;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close-button:hover,
        .close-button:focus {
            color: #000;
        }
        .expanding-iframe-overlay {
            position: fixed;
            z-index: 2000;
            background: #fff;
            box-shadow: 0 16px 32px rgba(0,0,0,0.18);
            border-radius: 8px;
            transition: all 0.5s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.3s;
            opacity: 1;
            pointer-events: auto;
        }
        .expanding-iframe-overlay.fullscreen {
            left: 0 !important;
            top: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 16px !important;
            box-shadow: 0 32px 64px rgba(0,0,0,0.25);
            opacity: 1;
            transform: scale(1) !important;
        }
        .modal-bg {
            display: none;
            position: fixed;
            z-index: 4000;
            left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .modal-bg.show {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .mini-iframe.expanded {
            z-index: 5000 !important;
        }
        .container.modal-active {
            pointer-events: none;
            filter: blur(2px) grayscale(0.2);
        }
        .container.modal-active .mini-iframe.expanded {
            pointer-events: auto;
            filter: none;
        }

        /* ── Correlates modal ── */
        #corr-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.55); z-index: 6000;
            opacity: 0; transition: opacity 0.25s;
        }
        #corr-overlay.open { display: block; opacity: 1; }
        #corr-modal {
            display: none; position: fixed;
            top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.96);
            width: min(860px, 96vw); height: min(88vh, 800px);
            background: #fff; z-index: 6001;
            border-radius: 14px;
            box-shadow: 0 12px 48px rgba(0,0,0,0.25);
            flex-direction: column; overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1), opacity 0.25s;
            opacity: 0;
        }
        #corr-modal.open { display: flex; transform: translate(-50%,-50%) scale(1); opacity: 1; }
        #corr-header {
            padding: 1.1em 1.4em 0.8em; background: #f7fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5em;
        }
        #corr-header-text { flex: 1; min-width: 0; }
        #corr-title { font-size: 1.15em; font-weight: 700; color: #1a202c; }
        #corr-desc  { margin-top: 0.25em; font-size: 0.85em; color: #4a5568; line-height: 1.4; }
        #corr-doclink { margin-top: 0.3em; display: inline-block; font-size: 0.82em; color: #3182ce; text-decoration: underline; }
        #corr-close { background: none; border: none; font-size: 1.6em; cursor: pointer; color: #718096; padding: 0; line-height: 1; }
        #corr-close:hover { color: #1a202c; }
        #corr-tabs {
            display: flex; gap: 0; border-bottom: 2px solid #e2e8f0;
            background: #f7fafc; padding: 0 1.2em;
        }
        .corr-tab {
            padding: 0.55em 1em; font-size: 0.82em; font-weight: 600;
            color: #718096; cursor: pointer; border: none; background: none;
            border-bottom: 2px solid transparent; margin-bottom: -2px;
            transition: color 0.15s, border-color 0.15s;
        }
        .corr-tab:hover { color: #2d3748; }
        .corr-tab.active { color: #2b6cb0; border-bottom-color: #2b6cb0; }
        #corr-body { flex: 1; overflow-y: auto; position: relative; }
        #corr-list { padding: 0; }
        #corr-scatter { display: none; padding: 1em 1.4em; flex-direction: column; align-items: center; height: 100%; overflow: hidden; }
        #corr-scatter.open { display: flex; }
        .corr-scatter-toolbar {
            width: 100%; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 0.5em; flex-wrap: wrap; gap: 0.3em;
        }
        .corr-scatter-title { font-size: 0.95em; font-weight: 700; color: #2d3748; }
        .corr-scatter-stats { font-size: 0.8em; color: #718096; }
        .corr-scatter-btns { display: flex; gap: 0.4em; }
        .corr-scatter-btns button {
            background: #ebf8ff; border: 1px solid #bee3f8;
            border-radius: 4px; color: #2b6cb0; font-size: 0.8em;
            cursor: pointer; padding: 3px 10px;
        }
        .corr-scatter-btns button:hover { background: #bee3f8; }
        #scatter-plot {
            width: 100%; flex: 1; min-height: 380px; max-height: 520px;
        }
        .type-badge {
            display: inline-block; font-size: 0.68em; font-weight: 700;
            padding: 1px 5px; border-radius: 3px; margin-left: 4px;
            vertical-align: middle; letter-spacing: 0.02em;
        }
        .type-r   { background: #ebf8ff; color: #2b6cb0; }
        .type-eta { background: #f0fff4; color: #276749; }
        .type-v   { background: #faf5ff; color: #6b46c1; }
        .corr-loading-msg, .corr-no-data {
            text-align: center; color: #718096; font-size: 0.95em; padding: 2em 1em;
        }
        .corr-table { width: 100%; border-collapse: collapse; }
        .corr-row  { cursor: pointer; transition: background 0.12s; }
        .corr-row:hover  { background: #ebf8ff; }
        .corr-row-scatter { cursor: pointer; transition: background 0.12s; }
        .corr-row-scatter:hover { background: #f0fff4; }
        .corr-rank { width: 2em; text-align: center; color: #a0aec0; font-size: 0.78em; padding: 0.5em 0.3em 0.5em 1em; }
        .corr-varname { font-family: monospace; font-size: 0.85em; font-weight: 700; color: #2d3748; padding: 0.5em 0.3em; white-space: nowrap; }
        .corr-vardesc { font-size: 0.78em; color: #4a5568; padding: 0.5em 0.3em; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .corr-bar-cell { padding: 0.5em 0.5em; white-space: nowrap; }
        .corr-bar  { display: inline-block; height: 8px; border-radius: 4px; opacity: 0.65; vertical-align: middle; min-width: 2px; }
        .corr-r    { font-size: 0.82em; font-weight: 700; margin-left: 5px; vertical-align: middle; }
        .corr-n    { font-size: 0.76em; color: #718096; padding: 0.5em 0.4em; white-space: nowrap; }
        .corr-btn {
            background: #ebf8ff; border: 1px solid #bee3f8;
            border-radius: 4px; color: #2b6cb0;
            font-size: 0.8em; cursor: pointer; padding: 2px 8px;
            transition: background 0.15s; white-space: nowrap;
        }
        .corr-btn:hover { background: #bee3f8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>pandas-nhanes</h1>
        
        <div class="grid-container" id="grid-container">
            
            <div class="carousel-wrapper" id="carousel-wrapper">
                <!-- Plot thumbnails will be automatically generated here -->
            </div>
            
            <div class="carousel-indicators" id="carousel-indicators">
                <!-- Indicators will be generated automatically -->
            </div>
        </div>

        <!-- Correlates modal -->
        <div id="corr-overlay"></div>
        <div id="corr-modal">
            <div id="corr-header">
                <div id="corr-header-text">
                    <div id="corr-title"></div>
                    <div id="corr-desc"></div>
                    <a id="corr-doclink" href="#" target="_blank" rel="noopener">NHANES documentation &#8599;</a>
                </div>
                <button id="corr-close" title="Close">&times;</button>
            </div>
            <div id="corr-tabs"></div>
            <div id="corr-body">
                <div id="corr-list"></div>
                <div id="corr-scatter">
                    <div class="corr-scatter-toolbar">
                        <div>
                            <span class="corr-scatter-title" id="scatter-title"></span><br>
                            <span class="corr-scatter-stats" id="scatter-stats"></span>
                        </div>
                        <div class="corr-scatter-btns">
                            <button id="scatter-swap" title="Swap X / Y axes">&#8644; Swap axes</button>
                            <button id="scatter-back">&larr; Back</button>
                        </div>
                    </div>
                    <div id="scatter-plot"></div>
                </div>
            </div>
        </div>

        <div id="variable-explorer">
            <h2>NHANES Variable Explorer</h2>
            <input type="text" id="search-input" placeholder="Search variables...">
            <div class="table-scroll">
                <table id="variables-table">
                    <thead>
                        <tr id="variables-table-header-row">
                            <!-- Headers will be loaded here -->
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Full-screen plot modal -->
    <div id="plot-modal" class="plot-modal">
        <div class="plot-modal-content">
            <button class="plot-modal-close" id="modal-close-btn">&times;</button>
            <iframe id="modal-iframe" src=""></iframe>
        </div>
    </div>

    <script>
        // PNG/HTML pairs for carousel and modal – loaded from plots.json (auto-generated by CI)
        let plotExamples = [];
        let currentIndex = 0;
        let plotItems = [];
        
        // No longer loading from plots.txt

// Add images to carousel as they load, show carousel after first image
function loadImagesIndividually(plotExamples, baseWidth = 300) {
    const carouselWrapper = document.getElementById('carousel-wrapper');
    const indicatorsContainer = document.getElementById('carousel-indicators');
    plotItems = [];
    plotExamples.forEach((plot, index) => {
        const img = new window.Image();
        img.src = plot.png;
        img.alt = plot.base;
        img.onload = function() {
            const aspectRatio = img.naturalWidth / img.naturalHeight;
            const thumbnailWidth = baseWidth;
            const thumbnailHeight = Math.round(baseWidth / aspectRatio);
            const gridItem = document.createElement('div');
            gridItem.className = 'grid-item';
            gridItem.dataset.index = index;
            gridItem.style.width = `${thumbnailWidth}px`;
            gridItem.style.height = `${thumbnailHeight}px`;
            img.style.maxWidth = '100%';
            img.style.maxHeight = '100%';
            img.style.objectFit = 'contain';
            img.style.display = 'block';
            img.style.margin = '0 auto';
            gridItem.appendChild(img);
            gridItem.addEventListener('click', function(e) {
                if (!e.target.closest('.indicator') && !e.target.closest('.carousel-nav')) {
                    e.preventDefault();
                    openModalFromTile(gridItem);
                }
            });
            // Insert in correct order
            if (carouselWrapper.children.length > index) {
                carouselWrapper.insertBefore(gridItem, carouselWrapper.children[index]);
            } else {
                carouselWrapper.appendChild(gridItem);
            }
            // Add indicator if not already present
            if (!indicatorsContainer.querySelector(`[data-index="${index}"]`)) {
                const indicator = document.createElement('div');
                indicator.className = 'indicator';
                indicator.dataset.index = index;
                indicator.addEventListener('click', () => goToSlide(index));
                indicatorsContainer.appendChild(indicator);
            }
            plotItems[index] = { element: gridItem, base: plot.base, width: img.naturalWidth, height: img.naturalHeight };
            // Enable horizontal scrolling with snap
            carouselWrapper.style.overflowX = 'auto';
            carouselWrapper.style.scrollSnapType = 'x mandatory';
            carouselWrapper.style.scrollBehavior = 'smooth';
            carouselWrapper.childNodes.forEach(node => {
                if (node.nodeType === 1) node.style.scrollSnapAlign = 'center';
            });
            // Fade in the grid item
            setTimeout(() => {
                gridItem.style.opacity = '0.7';
                if (index === currentIndex) gridItem.classList.add('active');
            }, 10);
            updateCarousel();
        };
        img.onerror = function() {
            // fallback: still add a blank grid item
            const gridItem = document.createElement('div');
            gridItem.className = 'grid-item';
            gridItem.dataset.index = index;
            gridItem.style.width = `${baseWidth}px`;
            gridItem.style.height = `${baseWidth}px`;
            gridItem.textContent = 'Image failed';
            if (carouselWrapper.children.length > index) {
                carouselWrapper.insertBefore(gridItem, carouselWrapper.children[index]);
            } else {
                carouselWrapper.appendChild(gridItem);
            }
            plotItems[index] = { element: gridItem, base: plot.base };
            setTimeout(() => {
                gridItem.style.opacity = '0.7';
                if (index === currentIndex) gridItem.classList.add('active');
            }, 10);
            updateCarousel();
        };
    });
}

        function createPlotThumbnails() {
    const carouselWrapper = document.getElementById('carousel-wrapper');
    const indicatorsContainer = document.getElementById('carousel-indicators');
            // Responsive thumbnail width
            const baseWidth = Math.min(300, Math.max(160, Math.floor(window.innerWidth * 0.7)));
    // Remove any existing children (for reloads)
    carouselWrapper.innerHTML = '';
    indicatorsContainer.innerHTML = '';
    loadImagesIndividually(plotExamples, baseWidth);
}

        function updateCarousel() {
            const wrapper = document.getElementById('carousel-wrapper');
            plotItems.forEach((item, index) => {
                if (!item || !item.element) return;
                const element = item.element;
                element.classList.remove('active', 'side');
                if (index === currentIndex) {
                    element.classList.add('active');
                } else if (Math.abs(index - currentIndex) === 1) {
                    element.classList.add('side');
                }
            });
            document.querySelectorAll('.indicator').forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentIndex);
            });
            // Scroll to the active item if not user scrolling
            if (!wrapper.classList.contains('user-scrolling')) {
                const activeItem = plotItems[currentIndex] && plotItems[currentIndex].element;
                if (activeItem) {
                    activeItem.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                }
            }
        }

        function goToSlide(index) {
            if (index >= 0 && index < plotItems.length) {
                currentIndex = index;
                updateCarousel();
            }
        }
        function nextSlide() {
            if (currentIndex < plotItems.length - 1) {
                goToSlide(currentIndex + 1);
            }
        }
        function prevSlide() {
            if (currentIndex > 0) {
                goToSlide(currentIndex - 1);
            }
        }

        // --- Modal logic: show HTML in iframe for expanded view ---
        function openModalFromTile(gridItem) {
            const index = parseInt(gridItem.dataset.index);
            const plot = plotExamples[index];
            if (!plot) return;
            const modal = document.getElementById('plot-modal');
            const modalContent = document.querySelector('.plot-modal-content');
            let modalImg = document.getElementById('modal-img');
            let modalIframe = document.getElementById('modal-iframe');
            // Remove any previous modalImg
            if (modalImg) modalImg.remove();
            // Hide iframe and reset src
            if (modalIframe) {
                modalIframe.style.opacity = '0';
                modalIframe.style.display = 'none';
                modalIframe.src = '';
            }
            // Add PNG image as background
            modalImg = document.createElement('img');
            modalImg.id = 'modal-img';
            modalImg.src = plot.png;
            modalImg.alt = plot.base;
            modalImg.style.position = 'absolute';
            modalImg.style.top = '0';
            modalImg.style.left = '0';
            modalImg.style.width = '100%';
            modalImg.style.height = '100%';
            modalImg.style.objectFit = 'contain';
            modalImg.style.zIndex = '1';
            modalImg.style.transition = 'opacity 0.3s';
            modalImg.style.opacity = '1';
            // Insert image as first child of modalContent
            modalContent.insertBefore(modalImg, modalContent.firstChild);
            // Show modal
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
            // Now load the HTML in the iframe, fade in when loaded
            if (modalIframe && plot.html) {
                modalIframe.src = plot.html;
                modalIframe.style.display = 'block';
                modalIframe.classList.add('centered');
                modalIframe.style.zIndex = '2';
                modalIframe.style.background = 'transparent';
                modalIframe.style.opacity = '0';
                modalIframe.style.transition = 'opacity 0.5s';
                // Size to the image dimensions and scale to fit container
                const dims = plotItems[index] || {};
                if (dims.width && dims.height) {
                    modalIframe.dataset.contentWidth = String(dims.width);
                    modalIframe.dataset.contentHeight = String(dims.height);
                } else {
                    // Fallback defaults
                    modalIframe.dataset.contentWidth = '1200';
                    modalIframe.dataset.contentHeight = '800';
                }
                fitModalIframe();
                // Fade in iframe when loaded, hide PNG
                modalIframe.onload = function() {
                    setTimeout(() => {
                        fitModalIframe();
                        modalIframe.style.opacity = '1';
                        if (modalImg) {
                            modalImg.style.transition = 'opacity 0.5s';
                            modalImg.style.opacity = '0';
                            setTimeout(() => {
                                if (modalImg && modalImg.parentNode) modalImg.parentNode.removeChild(modalImg);
                            }, 500);
                        }
                    }, 50);
                };
            }
        }

        // Compute a scale so the iframe (using PNG dims) fits within modal content, center it
        function fitModalIframe() {
            const modal = document.getElementById('plot-modal');
            if (!modal || !modal.classList.contains('show')) return;
            const modalIframe = document.getElementById('modal-iframe');
            const modalContent = document.querySelector('.plot-modal-content');
            if (!modalIframe || !modalContent) return;
            const contentW = parseFloat(modalIframe.dataset.contentWidth || '1200');
            const contentH = parseFloat(modalIframe.dataset.contentHeight || '800');
            const rect = modalContent.getBoundingClientRect();
            const maxW = rect.width * 0.98;
            const maxH = rect.height * 0.98;
            const scale = Math.min(maxW / contentW, maxH / contentH, 1);
            modalIframe.style.position = 'absolute';
            modalIframe.style.top = '50%';
            modalIframe.style.left = '50%';
            modalIframe.style.width = contentW + 'px';
            modalIframe.style.height = contentH + 'px';
            modalIframe.style.transformOrigin = 'center center';
            modalIframe.style.transform = `translate(-50%, -50%) scale(${scale})`;
            modalIframe.style.willChange = 'transform';
        }
        function closeModal() {
            const modal = document.getElementById('plot-modal');
            const modalImg = document.getElementById('modal-img');
            const modalIframe = document.getElementById('modal-iframe');
            modal.classList.remove('show');
            setTimeout(() => {
                if (modalImg) modalImg.remove();
                if (modalIframe) modalIframe.src = '';
                if (modalIframe) modalIframe.style.display = '';
            }, 300);
            document.body.style.overflow = '';
        }

        // ── Correlates (on-the-fly) ─────────────────────────────────────────
        let varMeta   = {};   // {varName → {desc, docLink}} from CSV
        const cycleCache = {};  // {cycle → cycleJSON}
        let corrManifest = []; // [{cycle,n_cols,n_total,n_sample}]
        let corrActiveVar  = null;
        let corrActiveCycle = null;
        let scatterColX = null, scatterColY = null;

        // ── Data loading ─────────────────────────────────────────────────────
        async function loadManifest() {
            if (corrManifest.length) return corrManifest;
            try {
                const r = await fetch('data/manifest.json');
                if (r.ok) {
                    corrManifest = await r.json();
                    // Build Set per cycle for O(1) variable lookup
                    for (const m of corrManifest) {
                        m.varSet = new Set(m.vars || m.cols || []);
                    }
                }
            } catch { corrManifest = []; }
            return corrManifest;
        }
        async function loadCycleData(cycle) {
            if (cycleCache[cycle]) return cycleCache[cycle];
            const r = await fetch(`data/${cycle}.json`);
            if (!r.ok) return null;
            const d = await r.json();
            cycleCache[cycle] = d;
            return d;
        }

        // ── Correlation helpers ──────────────────────────────────────────────
        const MIN_SHARED = 50;
        const MIN_ASSOC  = 0.05;  // minimum effect size to surface a result

        function pearsonR(colA, colB) {
            let sx=0,sy=0,sxx=0,syy=0,sxy=0,n=0;
            for (let i=0;i<colA.length;i++) {
                const x=colA[i], y=colB[i];
                if (x===null||y===null) continue;
                sx+=x; sy+=y; sxx+=x*x; syy+=y*y; sxy+=x*y; n++;
            }
            if (n < MIN_SHARED) return null;
            const denom = Math.sqrt((n*sxx-sx*sx)*(n*syy-sy*sy));
            if (denom === 0) return null;
            const r = (n*sxy - sx*sy) / denom;
            const rCrit = 1.96 / Math.sqrt(1.96*1.96 + n - 2);
            if (Math.abs(r) < rCrit) return null;
            return { r: Math.round(r*1000)/1000, n };
        }

        // Correlation ratio η: sqrt(SS_between / SS_total)
        // numCol = continuous values, catCol = categorical codes
        function etaAssoc(numCol, catCol) {
            const groups = new Map();
            let totalSum = 0, totalN = 0;
            for (let i = 0; i < numCol.length; i++) {
                const x = numCol[i], c = catCol[i];
                if (x === null || c === null) continue;
                if (!groups.has(c)) groups.set(c, []);
                groups.get(c).push(x);
                totalSum += x; totalN++;
            }
            if (totalN < MIN_SHARED || groups.size < 2) return null;
            const grandMean = totalSum / totalN;
            let ssBetween = 0, ssTotal = 0;
            for (const [, vals] of groups) {
                const gMean = vals.reduce((a, v) => a + v, 0) / vals.length;
                ssBetween += vals.length * (gMean - grandMean) ** 2;
                for (const v of vals) ssTotal += (v - grandMean) ** 2;
            }
            if (ssTotal === 0) return null;
            const eta = Math.sqrt(ssBetween / ssTotal);
            if (eta < MIN_ASSOC) return null;
            return { eta: Math.round(eta * 1000) / 1000, n: totalN };
        }

        // Cramér's V for categorical × categorical pairs
        function cramersV(colA, colB) {
            const tableMap = new Map();
            const rowCounts = new Map();
            const colCounts = new Map();
            let n = 0;
            for (let i = 0; i < colA.length; i++) {
                const r = colA[i], c = colB[i];
                if (r === null || c === null) continue;
                const key = String(r) + ':' + String(c);
                tableMap.set(key, (tableMap.get(key) || 0) + 1);
                rowCounts.set(String(r), (rowCounts.get(String(r)) || 0) + 1);
                colCounts.set(String(c), (colCounts.get(String(c)) || 0) + 1);
                n++;
            }
            if (n < MIN_SHARED) return null;
            let chi2 = 0;
            for (const [key, observed] of tableMap) {
                const sep = key.indexOf(':');
                const rStr = key.slice(0, sep), cStr = key.slice(sep + 1);
                const expected = (rowCounts.get(rStr) * colCounts.get(cStr)) / n;
                if (expected > 0) chi2 += (observed - expected) ** 2 / expected;
            }
            const k = Math.min(rowCounts.size, colCounts.size);
            if (k <= 1) return null;
            const v = Math.sqrt(chi2 / (n * (k - 1)));
            if (v < MIN_ASSOC) return null;
            return { v: Math.round(v * 1000) / 1000, n };
        }

        function computeCorrelates(cycleData, varName) {
            const target = cycleData.data[varName];
            if (!target) return [];
            const colTypes = cycleData.col_types || {};
            const targetType = colTypes[varName] || 'num';
            const results = [];
            const cols = Object.keys(cycleData.data);
            for (const col of cols) {
                if (col === varName) continue;
                const other = cycleData.data[col];
                const otherType = colTypes[col] || 'num';
                let assoc = null, n = 0, type = 'r', sign = 1;
                if (targetType === 'num' && otherType === 'num') {
                    const res = pearsonR(target, other);
                    if (!res) continue;
                    assoc = res.r; n = res.n; type = 'r'; sign = Math.sign(res.r);
                } else if (targetType === 'num' && otherType === 'cat') {
                    const res = etaAssoc(target, other);
                    if (!res) continue;
                    assoc = res.eta; n = res.n; type = 'η'; sign = 1;
                } else if (targetType === 'cat' && otherType === 'num') {
                    const res = etaAssoc(other, target);
                    if (!res) continue;
                    assoc = res.eta; n = res.n; type = 'η'; sign = 1;
                } else {
                    const res = cramersV(target, other);
                    if (!res) continue;
                    assoc = res.v; n = res.n; type = 'V'; sign = 1;
                }
                results.push({ col, r: assoc, n, type, sign });
            }
            results.sort((a, b) => Math.abs(b.r) - Math.abs(a.r));
            return results;
        }

        // ── Show modal ───────────────────────────────────────────────────────
        async function showCorrelates(varName, varDesc, varDocLink, preferredCycle) {
            corrActiveVar = varName;
            document.getElementById('corr-title').textContent = varName;
            document.getElementById('corr-desc').textContent  = varDesc || '';
            const docA = document.getElementById('corr-doclink');
            docA.href = varDocLink || '#'; docA.style.display = varDocLink ? '' : 'none';
            document.getElementById('corr-list').innerHTML = '<div class="corr-loading-msg">Loading…</div>';
            document.getElementById('corr-scatter').classList.remove('open');
            document.getElementById('corr-list').style.display = '';
            document.getElementById('corr-overlay').classList.add('open');
            document.getElementById('corr-modal').classList.add('open');
            document.body.style.overflow = 'hidden';

            const manifest = await loadManifest();
            if (!manifest.length) {
                document.getElementById('corr-list').innerHTML = '<p class="corr-no-data">No cycle data available.</p>';
                return;
            }

            // Find which cycles actually contain this variable
            const cyclesWithVar = manifest.filter(m => m.varSet && m.varSet.has(varName));

            if (!cyclesWithVar.length) {
                document.getElementById('corr-tabs').innerHTML = '';
                document.getElementById('corr-list').innerHTML =
                    `<p class="corr-no-data">` +
                    `Variable <b>${varName}</b> is not available in the precomputed correlation data.<br><br>` +
                    `<span style="font-size:0.88em;color:#718096;">` +
                    `This can happen when the variable is non-numeric, has too few observations, ` +
                    `or belongs to a survey component not yet included in the sampled dataset. ` +
                    `Currently ${manifest.length} cycles are covered with ${manifest.reduce((s,m)=>s+(m.n_cols||0),0).toLocaleString()} numeric variables total.` +
                    `</span></p>`;
                return;
            }

            // Build cycle tabs — only cycles that have this variable
            const tabsEl = document.getElementById('corr-tabs');
            tabsEl.innerHTML = '';
            // Prefer the variable's own cycle; otherwise pick the most recent available
            const defaultCycle = cyclesWithVar.find(m => m.cycle === preferredCycle)
                ? preferredCycle
                : cyclesWithVar[cyclesWithVar.length - 1].cycle;

            for (const m of cyclesWithVar) {
                const btn = document.createElement('button');
                btn.className = 'corr-tab' + (m.cycle === defaultCycle ? ' active' : '');
                btn.textContent = m.cycle;
                btn.addEventListener('click', () => switchCycleTab(m.cycle));
                tabsEl.appendChild(btn);
            }
            switchCycleTab(defaultCycle);
        }

        async function switchCycleTab(cycle) {
            corrActiveCycle = cycle;
            // Highlight tab
            document.querySelectorAll('.corr-tab').forEach(t => t.classList.toggle('active', t.textContent === cycle));
            // Hide scatter, show list
            document.getElementById('corr-scatter').classList.remove('open');
            const listEl = document.getElementById('corr-list');
            listEl.style.display = '';
            listEl.innerHTML = '<div class="corr-loading-msg">Loading cycle data…</div>';

            const data = await loadCycleData(cycle);
            if (!data || !data.data[corrActiveVar]) {
                listEl.innerHTML = `<p class="corr-no-data">Variable <b>${corrActiveVar}</b> not found in ${cycle} data.</p>`;
                return;
            }

            const t0 = performance.now();
            const results = computeCorrelates(data, corrActiveVar);
            const ms = Math.round(performance.now() - t0);

            if (!results.length) {
                listEl.innerHTML = `<p class="corr-no-data">No significant correlates (p&lt;0.05) among ${data.cols.length} variables. Computed in ${ms}ms.</p>`;
                return;
            }
            renderCorrTable(results, data, ms);
        }

        function renderCorrTable(results, cycleData, ms) {
            const listEl = document.getElementById('corr-list');
            listEl.innerHTML = '';
            const colTypes = cycleData.col_types || {};
            const info = document.createElement('div');
            info.style.cssText = 'padding:0.5em 1.2em;font-size:0.78em;color:#718096;';
            const nNum = Object.values(colTypes).filter(t => t === 'num').length;
            const nCat = Object.values(colTypes).filter(t => t === 'cat').length;
            info.textContent = `${results.length} significant associations among ${cycleData.cols.length} variables (${nNum} numeric, ${nCat} categorical) · ${ms}ms`;
            listEl.appendChild(info);
            const tbl = document.createElement('table');
            tbl.className = 'corr-table';
            results.forEach(({col, r, n, type, sign}, idx) => {
                const meta = varMeta[col] || {};
                const desc = meta.desc || col;
                const absR = Math.abs(r);
                const color = type === 'r' ? (sign >= 0 ? '#2b6cb0' : '#c53030')
                            : type === 'η' ? '#276749' : '#6b46c1';
                const rStr = type === 'r' ? (sign >= 0 ? '+' : '') + r.toFixed(3) : r.toFixed(3);
                const nFmt = n >= 1000 ? (n/1000).toFixed(1)+'k' : String(n);
                const shortD = desc.length > 50 ? desc.slice(0,50)+'\u2026' : desc;
                const typeClass = type === 'r' ? 'type-r' : type === 'η' ? 'type-eta' : 'type-v';
                const colType = colTypes[col] || 'num';
                const colTypeBadge = colType === 'cat' ? ' <span style="font-size:0.68em;color:#a0aec0">cat</span>' : '';
                const tr = document.createElement('tr');
                tr.className = 'corr-row-scatter';
                tr.title = 'Click to view chart';
                tr.innerHTML = `
                    <td class="corr-rank">${idx+1}</td>
                    <td class="corr-varname">${col}${colTypeBadge}</td>
                    <td class="corr-vardesc" title="${desc.replace(/"/g,'&quot;')}">${shortD}</td>
                    <td class="corr-bar-cell">
                        <div class="corr-bar" style="width:${Math.round(absR*100)}px;background:${color}"></div>
                        <span class="corr-r" style="color:${color}">${rStr} <span class="type-badge ${typeClass}">${type}</span></span>
                    </td>
                    <td class="corr-n" title="${n.toLocaleString()} shared observations">n=${nFmt}</td>`;
                tr.addEventListener('click', () => openScatter(corrActiveVar, col, cycleData));
                tbl.appendChild(tr);
            });
            listEl.appendChild(tbl);
        }

        // ── Scatter plot ─────────────────────────────────────────────────────
        function openScatter(colA, colB, cycleData) {
            scatterColX = colB; scatterColY = colA;
            document.getElementById('corr-list').style.display = 'none';
            document.getElementById('corr-scatter').classList.add('open');
            drawScatter(cycleData);
        }

        function drawScatter(cycleData) {
            const dataX = cycleData.data[scatterColX];
            const dataY = cycleData.data[scatterColY];
            const colTypes = cycleData.col_types || {};
            if (!dataX || !dataY) return;
            const typeX = colTypes[scatterColX] || 'num';
            const typeY = colTypes[scatterColY] || 'num';
            const metaX = varMeta[scatterColX] || {};
            const metaY = varMeta[scatterColY] || {};
            const xLabel = `${scatterColX}${metaX.desc ? ' — ' + metaX.desc.slice(0,40) : ''}`;
            const yLabel = `${scatterColY}${metaY.desc ? ' — ' + metaY.desc.slice(0,40) : ''}`;

            const xs = [], ys = [];
            for (let i = 0; i < dataX.length; i++) {
                if (dataX[i] !== null && dataY[i] !== null) { xs.push(dataX[i]); ys.push(dataY[i]); }
            }

            document.getElementById('scatter-title').textContent = `${scatterColY} × ${scatterColX}`;

            if (xs.length < 2) {
                document.getElementById('scatter-plot').innerHTML =
                    '<p style="padding:50px;text-align:center;color:#718096">Not enough shared sampled points.</p>';
                return;
            }

            const cfg = { responsive: true, displayModeBar: true,
                          modeBarButtonsToRemove: ['toImage', 'sendDataToCloud'],
                          displaylogo: false };
            const baseLayout = {
                margin: { t: 20, r: 20, b: 80, l: 80 },
                paper_bgcolor: '#fafbfc', plot_bgcolor: '#fafbfc',
                font: { family: 'system-ui, -apple-system, sans-serif', size: 11 },
                showlegend: false
            };

            if (typeX === 'num' && typeY === 'num') {
                // Scatter + OLS regression line
                let sx=0,sy=0,sxx=0,syy=0,sxy=0;
                const nn = xs.length;
                for (let i=0;i<nn;i++){sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];syy+=ys[i]*ys[i];sxy+=xs[i]*ys[i];}
                const denom = Math.sqrt((nn*sxx-sx*sx)*(nn*syy-sy*sy));
                const r = denom ? (nn*sxy-sx*sy)/denom : 0;
                const slope = (nn*sxx-sx*sx) ? (nn*sxy-sx*sy)/(nn*sxx-sx*sx) : 0;
                const intercept = sy/nn - slope*(sx/nn);
                const xMin=Math.min(...xs), xMax=Math.max(...xs);
                document.getElementById('scatter-stats').textContent =
                    `Pearson r = ${r>=0?'+':''}${r.toFixed(3)}  ·  n = ${nn.toLocaleString()}`;
                Plotly.react('scatter-plot', [
                    { x: xs, y: ys, type: 'scatter', mode: 'markers', name: 'Data',
                      marker: { size: 5, opacity: 0.35, color: '#3182ce' },
                      hovertemplate: `${scatterColX}: %{x:.3g}<br>${scatterColY}: %{y:.3g}<extra></extra>` },
                    { x: [xMin, xMax], y: [slope*xMin+intercept, slope*xMax+intercept],
                      type: 'scatter', mode: 'lines', name: 'OLS',
                      line: { color: '#e53e3e', width: 2.5 }, hoverinfo: 'skip' }
                ], { ...baseLayout,
                     xaxis: { title: xLabel, automargin: true },
                     yaxis: { title: yLabel, automargin: true } }, cfg);

            } else if (typeX === 'cat' && typeY === 'num') {
                // Box plot: X = category groups, Y = numeric
                const groups = {};
                for (let i = 0; i < xs.length; i++) {
                    const k = String(xs[i]);
                    if (!(k in groups)) groups[k] = [];
                    groups[k].push(ys[i]);
                }
                const cats = Object.keys(groups).sort((a,b) => Number(a)-Number(b));
                document.getElementById('scatter-stats').textContent =
                    `η association  ·  n = ${xs.length.toLocaleString()}  ·  ${cats.length} categories`;
                Plotly.react('scatter-plot',
                    cats.map(cat => ({
                        y: groups[cat], type: 'box', name: cat,
                        boxpoints: groups[cat].length <= 300 ? 'outliers' : false,
                        marker: { size: 3, opacity: 0.5, color: '#3182ce' }
                    })),
                    { ...baseLayout,
                      xaxis: { title: xLabel },
                      yaxis: { title: yLabel, automargin: true } }, cfg);

            } else if (typeX === 'num' && typeY === 'cat') {
                // Horizontal box plot: Y = category groups, X = numeric
                const groups = {};
                for (let i = 0; i < ys.length; i++) {
                    const k = String(ys[i]);
                    if (!(k in groups)) groups[k] = [];
                    groups[k].push(xs[i]);
                }
                const cats = Object.keys(groups).sort((a,b) => Number(a)-Number(b));
                document.getElementById('scatter-stats').textContent =
                    `η association  ·  n = ${xs.length.toLocaleString()}  ·  ${cats.length} categories`;
                Plotly.react('scatter-plot',
                    cats.map(cat => ({
                        x: groups[cat], type: 'box', name: cat, orientation: 'h',
                        boxpoints: groups[cat].length <= 300 ? 'outliers' : false,
                        marker: { size: 3, opacity: 0.5, color: '#3182ce' }
                    })),
                    { ...baseLayout,
                      xaxis: { title: xLabel, automargin: true },
                      yaxis: { title: yLabel } }, cfg);

            } else {
                // Both categorical: contingency heatmap
                const rowCats = [...new Set(ys.filter(v=>v!==null))].map(Number).sort((a,b)=>a-b);
                const colCats = [...new Set(xs.filter(v=>v!==null))].map(Number).sort((a,b)=>a-b);
                const z = rowCats.map(r =>
                    colCats.map(c => {
                        let count = 0;
                        for (let i = 0; i < xs.length; i++) { if (xs[i]===c && ys[i]===r) count++; }
                        return count;
                    })
                );
                document.getElementById('scatter-stats').textContent =
                    `Cramér's V  ·  n = ${xs.length.toLocaleString()}  ·  ${rowCats.length} × ${colCats.length} categories`;
                Plotly.react('scatter-plot',
                    [{ z, x: colCats.map(String), y: rowCats.map(String),
                       type: 'heatmap', colorscale: 'Blues', showscale: true,
                       hovertemplate: `${scatterColX}=%{x}<br>${scatterColY}=%{y}<br>count=%{z}<extra></extra>` }],
                    { ...baseLayout,
                      xaxis: { title: xLabel },
                      yaxis: { title: yLabel, automargin: true } }, cfg);
            }
        }

        function swapScatterAxes() {
            const tmp = scatterColX; scatterColX = scatterColY; scatterColY = tmp;
            if (corrActiveCycle && cycleCache[corrActiveCycle]) {
                drawScatter(cycleCache[corrActiveCycle]);
            }
        }

        function closeScatter() {
            const plotDiv = document.getElementById('scatter-plot');
            if (plotDiv && plotDiv.data) Plotly.purge(plotDiv);
            document.getElementById('corr-scatter').classList.remove('open');
            document.getElementById('corr-list').style.display = '';
        }

        function closeCorrelates() {
            closeScatter();
            document.getElementById('corr-modal').classList.remove('open');
            document.getElementById('corr-overlay').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.addEventListener("DOMContentLoaded", async function() {
            // Load plot list from plots.json (kept up-to-date by GitHub Actions)
            try {
                const res = await fetch('plots.json');
                if (res.ok) plotExamples = await res.json();
            } catch (e) {
                console.warn('Could not load plots.json – carousel will be empty', e);
            }
            createPlotThumbnails();

            // ── Correlates modal wiring ──────────────────────────────────────
            document.getElementById('corr-overlay').addEventListener('click', closeCorrelates);
            document.getElementById('corr-close').addEventListener('click', closeCorrelates);
            document.getElementById('scatter-swap').addEventListener('click', swapScatterAxes);
            document.getElementById('scatter-back').addEventListener('click', closeScatter);
            // Prefetch manifest so the first click is instant
            if (window.requestIdleCallback) {
                requestIdleCallback(() => loadManifest(), { timeout: 2000 });
            } else {
                setTimeout(() => loadManifest(), 2000);
            }

            // Removed prev/next button event listeners since buttons are gone
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    prevSlide();
                } else if (e.key === 'ArrowRight') {
                    nextSlide();
                } else if (e.key === 'Escape') {
                    closeModal();
                    closeCorrelates();
                }
            });
            // Touch/double-touch swipe
            let startX = 0;
            let startY = 0;
            let touchCount = 0;
            const carousel = document.getElementById('grid-container');
            carousel.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    touchCount = 2;
                    startX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    startY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                } else if (e.touches.length === 1) {
                    touchCount = 1;
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }
            }, { passive: true });
            carousel.addEventListener('touchend', (e) => {
                let endX, endY;
                if (touchCount === 2 && e.changedTouches.length >= 2) {
                    endX = (e.changedTouches[0].clientX + e.changedTouches[1].clientX) / 2;
                    endY = (e.changedTouches[0].clientY + e.changedTouches[1].clientY) / 2;
                } else {
                    endX = e.changedTouches[0].clientX;
                    endY = e.changedTouches[0].clientY;
                }
                const diffX = startX - endX;
                const diffY = startY - endY;
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        nextSlide();
                    } else {
                        prevSlide();
                    }
                }
                touchCount = 0;
            }, { passive: true });
            // Enable mouse/touchpad horizontal scroll for carousel
            const carouselWrapper = document.getElementById('carousel-wrapper');
            let scrollTimeout;
            carouselWrapper.addEventListener('scroll', function() {
                carouselWrapper.classList.add('user-scrolling');
                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    // Find the closest grid-item to the center
                    const wrapperRect = carouselWrapper.getBoundingClientRect();
                    let minDist = Infinity;
                    let closestIdx = 0;
                    plotItems.forEach((item, idx) => {
                        const rect = item.element.getBoundingClientRect();
                        const itemCenter = rect.left + rect.width / 2;
                        const dist = Math.abs(itemCenter - (wrapperRect.left + wrapperRect.width / 2));
                        if (dist < minDist) {
                            minDist = dist;
                            closestIdx = idx;
                        }
                    });
                    if (closestIdx !== currentIndex) {
                        currentIndex = closestIdx;
                        updateCarousel();
                    }
                    carouselWrapper.classList.remove('user-scrolling');
                }, 120);
            }, { passive: true });
            window.addEventListener('resize', () => {
                updateCarousel();
                fitModalIframe();
            });
            const searchInput = document.getElementById('search-input');
            const tableBody = document.querySelector('#variables-table tbody');
            const tableHeaderRow = document.getElementById('variables-table-header-row');
            let allData = []; // raw objects
            let fields = [];
            let allRowEls = []; // tr elements for current render

            // Event delegation: corr buttons rendered via innerHTML can't have direct listeners
            tableBody.addEventListener('click', e => {
                const btn = e.target.closest('.corr-btn');
                if (!btn) return;
                e.stopPropagation();
                showCorrelates(btn.dataset.var, btn.dataset.desc, btn.dataset.doc, btn.dataset.cycle);
            });
            // Status element
            const statusEl = document.createElement('div');
            statusEl.id = 'table-status';
            statusEl.textContent = 'Loading variables...';
            const explorer = document.getElementById('variable-explorer');
            explorer.insertBefore(statusEl, explorer.querySelector('.table-scroll'));

            // Helper: render header once
            function renderHeader(cols) {
                if (!cols || !cols.length) return;
                tableHeaderRow.innerHTML = '';
                cols.forEach(field => {
                    const th = document.createElement('th');
                    th.textContent = field;
                    tableHeaderRow.appendChild(th);
                });
                const thCorr = document.createElement('th');
                thCorr.textContent = 'Correlates';
                thCorr.title = 'Click to find significantly co-moving variables';
                tableHeaderRow.appendChild(thCorr);
            }
            // Helper: build a row element from data
            function buildRow(row) {
                const tr  = document.createElement('tr');
                const vn  = (row['variable name'] || '').replace(/"/g, '&quot;');
                const vd  = (row['variable explanation'] || '').replace(/"/g, '&quot;');
                const vl  = (row['dataset documentation link'] || '').replace(/"/g, '&quot;');
                const vc  = (row['cycle name'] || '').replace(/"/g, '&quot;');
                tr.innerHTML = fields.map(f => {
                    const v = row[f];
                    if (f === 'dataset link' && v) {
                        return `<td><a href="${v}" target="_blank" rel="noopener">data</a></td>`;
                    } else if (f === 'dataset documentation link' && v) {
                        return `<td><a href="${v}" target="_blank" rel="noopener">doc</a></td>`;
                    } else {
                        return `<td>${v || ''}</td>`;
                    }
                }).join('') +
                `<td><button class="corr-btn" data-var="${vn}" data-desc="${vd}" data-doc="${vl}" data-cycle="${vc}" title="Find correlated variables">correlates</button></td>`;
                return tr;
            }
            // Incremental append in batches to avoid layout thrash
            function appendBatch(batch) {
                const frag = document.createDocumentFragment();
                batch.forEach(row => {
                    const tr = buildRow(row);
                    frag.appendChild(tr);
                    allRowEls.push(tr);
                });
                tableBody.appendChild(frag);
            }
            // Append queue processed on idle frames
            const appendQueue = [];
            const buffer = [];
            let appendScheduled = false;
            function scheduleAppend() {
                if (appendScheduled) return;
                appendScheduled = true;
                (window.requestIdleCallback || window.requestAnimationFrame)(function() {
                    appendScheduled = false;
                    const batch = appendQueue.shift();
                    if (batch) {
                        appendBatch(batch);
                        if (appendQueue.length) scheduleAppend();
                    }
                });
            }
            // Stream parse using worker
            const csvUrl = new URL('./pandas_nhanes/nhanes_variables.csv', window.location.href).toString();
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                worker: true,
                step: function(results, parser) {
                    const row = results.data;
                    if (fields.length === 0 && results.meta && results.meta.fields) {
                        fields = results.meta.fields.slice();
                        renderHeader(fields);
                    }
                    // Only keep non-empty rows
                    if (fields.some(f => row[f] && String(row[f]).trim() !== '')) {
                        allData.push(row);
                        // Buffer rows then append in chunks
                        buffer.push(row);
                        if (buffer.length >= 100) {
                            const batch = buffer.splice(0, buffer.length);
                            appendQueue.push(batch);
                            scheduleAppend();
                        }
                    }
                },
                complete: function() {
                    if (buffer.length) {
                        appendQueue.push(buffer.splice(0, buffer.length));
                        scheduleAppend();
                    }
                    // Build varMeta for the correlates drawer (first occurrence per variable)
                    allData.forEach(row => {
                        const vn = row['variable name'];
                        if (vn && !varMeta[vn]) {
                            varMeta[vn] = {
                                desc:    row['variable explanation'] || '',
                                docLink: row['dataset documentation link'] || '',
                            };
                        }
                    });
                    statusEl.textContent = `Loaded ${allData.length.toLocaleString()} variables.`;
                },
                error: function(err) {
                    statusEl.textContent = `Failed to load variables: ${err}`;
                }
            });

            // Debounced, async search over allData with chunked DOM updates
            let searchEpoch = 0;
            function applySearch(term) {
                const myEpoch = ++searchEpoch;
                // Reset table quickly
                tableBody.innerHTML = '';
                allRowEls = [];
                if (!term) {
                    // Render first N quickly, then stream rest for idle loading
                    const initial = allData.slice(0, 300);
                    appendBatch(initial);
                    let idx = 300;
                    function streamRest() {
                        if (myEpoch !== searchEpoch) return; // canceled
                        if (idx >= allData.length) return;
                        const next = allData.slice(idx, idx + 300);
                        idx += 300;
                        appendBatch(next);
                        (window.requestIdleCallback || window.requestAnimationFrame)(streamRest);
                    }
                    (window.requestIdleCallback || window.requestAnimationFrame)(streamRest);
                    statusEl.textContent = `Showing ${Math.min(300, allData.length).toLocaleString()} of ${allData.length.toLocaleString()} rows (idle streaming...)`;
                    return;
                }
                const lower = term.toLowerCase();
                let i = 0;
                let shown = 0;
                function processChunk() {
                    if (myEpoch !== searchEpoch) return; // canceled
                    const end = Math.min(i + 400, allData.length);
                    const batch = [];
                    for (; i < end; i++) {
                        const row = allData[i];
                        // Fast stringify and match
                        for (let k = 0; k < fields.length; k++) {
                            const v = row[fields[k]];
                            if (v && String(v).toLowerCase().includes(lower)) {
                                batch.push(row);
                                break;
                            }
                        }
                    }
                    if (batch.length) {
                        appendBatch(batch);
                        shown += batch.length;
                        statusEl.textContent = `Found ${shown.toLocaleString()} (scanning...)`;
                    }
                    if (i < allData.length) {
                        setTimeout(processChunk, 0);
                    } else {
                        statusEl.textContent = `Found ${shown.toLocaleString()} matches.`;
                    }
                }
                processChunk();
            }
            function debounce(fn, delay) {
                let t;
                return (...args) => {
                    clearTimeout(t);
                    t = setTimeout(() => fn.apply(null, args), delay);
                };
            }
            const onSearch = debounce(() => applySearch(searchInput.value.trim()), 150);
            searchInput.addEventListener('input', onSearch);
            document.getElementById('modal-close-btn').addEventListener('click', closeModal);
            document.getElementById('plot-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
            document.addEventListener('mousedown', function(e) {
                const modal = document.getElementById('plot-modal');
                if (modal.classList.contains('show') && e.target === modal) {
                    closeModal();
                }
            });
            // (Removed document-level click handler for grid-item)
        });
    </script>
</body>
